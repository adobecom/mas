name: Unit Tests
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
jobs:
    run-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: run npm clean install
              run: npm ci

            - name: Force update @adobecom/milo dependency
              run: npm add github:adobecom/milo#stage

            - name: Install XVFB
              run: sudo apt-get install xvfb

            - name: Run the tests
              run: xvfb-run -a npm test

            - name: Upload coverage to Codecov
              # Run even when the test step fails: the suite still writes lcov, and
              # the required codecov/patch + codecov/project checks only finalize once
              # they receive the upload — a skipped upload leaves them pending and
              # blocks merge.
              if: always()
              uses: codecov/codecov-action@v5
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: studio/coverage/lcov.info,web-components/coverage/lcov.info,io/studio/coverage/lcov.info,ost/coverage/lcov.info
