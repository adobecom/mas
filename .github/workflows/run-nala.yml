name: Run Nala Tests

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, labeled, unlabeled]
    # Re-evaluate when a review lands, so an already-labeled PR starts Nala
    # as soon as it reaches the required approval count.
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read
    checks: read
    actions: read

env:
    # Keep in sync with the branch-protection required-approval count. These are
    # separate sources of truth and will drift if one is changed without the other.
    REQUIRED_APPROVALS: 2
    # Shared request-budget defaults live in nala/libs/request-budgets.js.
    # The workflow defines the fixed Studio + Docs infrastructure allocation.
    NALA_TOTAL_WORKERS: 12

# Job-level concurrency lets reviews report without waiting for or cancelling tests.
# A new commit explicitly cancels superseded workflows before evaluating launch eligibility.

jobs:
    cancel-superseded-runs:
        name: Cancel Superseded Nala Runs
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
            pull-requests: read
        outputs:
            superseded-runs: ${{ steps.cancel.outputs.superseded-runs }}
        steps:
            - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
              id: cancel
              with:
                  script: |
                      const eventPr = context.payload.pull_request;
                      const { data: pr } = await github.rest.pulls.get({
                          ...context.repo, pull_number: eventPr.number,
                      });
                      if (pr.head.sha !== eventPr.head.sha) {
                          core.info('This push has already been superseded; leaving newer workflows untouched.');
                          return;
                      }
                      const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                          ...context.repo, workflow_id: 'run-nala.yml',
                          branch: pr.head.ref, per_page: 100,
                      });
                      const supersededRuns = [];
                      for (const run of runs) {
                          if (run.id >= context.runId || run.status === 'completed') continue;
                          if (!['pull_request', 'pull_request_review'].includes(run.event)) continue;
                          const references = run.pull_requests ?? [];
                          const samePr = references.some((reference) => reference.number === pr.number) ||
                              (references.length === 0 && run.head_branch === pr.head.ref &&
                                  run.head_repository?.full_name === pr.head.repo.full_name);
                          if (!samePr) continue;
                          try {
                              await github.rest.actions.cancelWorkflowRun({
                                  ...context.repo, run_id: run.id,
                              });
                              core.info(`Requested cancellation of superseded Nala workflow: ${run.html_url}`);
                          } catch (error) {
                              if (error.status !== 409) throw error;
                              const { data: latest } = await github.rest.actions.getWorkflowRun({
                                  ...context.repo, run_id: run.id,
                              });
                              if (latest.status !== 'completed') throw error;
                              core.info(`Superseded Nala workflow already completed: ${run.html_url}`);
                          }
                          supersededRuns.push({ id: run.id, check_suite_id: run.check_suite_id });
                      }
                      core.setOutput('superseded-runs', JSON.stringify(supersededRuns));

    identity:
        uses: ./.github/workflows/resolve-aio-identity.yaml
        with:
            login: ${{ github.event.pull_request.user.login }}

    check-paths:
        name: Check Changed Paths
        runs-on: ubuntu-latest
        # No concurrency group: a cancelled result would stick to a gate re-run.
        outputs:
            is-trivial: ${{ steps.filter.outputs.trivial }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # pull_request_review defaults to the base branch, and the event
                  # payload SHA is a stale snapshot on a replayed re-run. The pull ref
                  # always resolves to the live head, matching the E2E jobs.
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
                  fetch-depth: 0
            - name: Detect trivial-only changes
              id: filter
              uses: ./.github/actions/detect-trivial
              with:
                  base-ref: ${{ github.event.pull_request.base.ref }}

    check-approvals:
        name: Check Label and Approvals
        needs: cancel-superseded-runs
        if: ${{ !cancelled() && (needs.cancel-superseded-runs.result == 'success' || needs.cancel-superseded-runs.result == 'skipped') }}
        runs-on: ubuntu-latest
        # Explicit requests (new commit, 're-added run nala') get their own group so an
        # incidental review or label change cannot cancel them before Nala starts.
        concurrency:
            group: nala-check-approvals-${{ github.event.pull_request.number }}-${{ (github.run_attempt > 1 || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala')))) && 'request' || 'recheck' }}
            cancel-in-progress: true
        timeout-minutes: 5
        outputs:
            can-run: ${{ steps.check.outputs.can-run }}
            # A prior conclusion of any kind means Nala must not be started again
            # for this commit; the gate resolves the verdict itself.
            already-handled: ${{ steps.check.outputs.nala-conclusion != '' && steps.check.outputs.nala-conclusion != 'none' }}
            head-sha: ${{ steps.check.outputs.head-sha }}
            head-branch: ${{ steps.check.outputs.head-branch }}
            head-owner: ${{ steps.check.outputs.head-owner }}
            head-repo: ${{ steps.check.outputs.head-repo }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # pull_request_review defaults to the base branch, and the event
                  # payload SHA is a stale snapshot on a replayed re-run.
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
            - name: Count current approvals
              id: check
              uses: ./.github/actions/resolve-nala-status
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  required-approvals: ${{ env.REQUIRED_APPROVALS }}
                  # A new commit, or deliberately re-adding the 'run nala' label, is a
                  # genuine request to (re)run Nala. Anything else that re-evaluates the
                  # gate — a review landing/being dismissed, or an unrelated label change
                  # — must not restart Nala if it already ran (or is still running) for
                  # this exact commit. Without this, every extra approval beyond the
                  # required count fires a brand-new full suite.
                  # A manual re-run replays the original event, so treat any re-attempt as explicit too.
                  consult-prior-runs: ${{ !(github.run_attempt > 1 || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala')))) }}
                  # Approval reporting must not wait for tests; only the gate waits.
                  wait-for-in-flight: 'false'
                  ignore-current-run: 'true'
                  superseded-runs: ${{ needs.cancel-superseded-runs.outputs.superseded-runs || '[]' }}
                  github-token: ${{ github.token }}

    run-nala-studio-tests:
        name: Running Nala Studio [${{ matrix.shard }}] E2E UI Tests
        needs: [check-paths, check-approvals]
        if: |
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true' &&
            needs.check-approvals.outputs.already-handled != 'true'
        concurrency:
            group: nala-studio-tests-${{ github.event.pull_request.number }}-${{ matrix.shard }}
            cancel-in-progress: ${{ github.run_attempt > 1 || (github.event_name == 'pull_request' && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala'))) }}
        runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
        timeout-minutes: 45 # Prevent hanging jobs
        # Fixed participating runner pool: each uniquely labeled runner executes one job
        # at a time, including cleanup, even when different PRs overlap. This allocation
        # does not coordinate legacy workflows or other nonparticipating jobs.
        # Backend scheduling allocates the shared Odin budget * NALA_WORKER_COUNT / NALA_TOTAL_WORKERS
        # to this job; the same job-level budget is inherited by standalone cleanup.
        env:
            NALA_WORKER_COUNT: ${{ matrix.workers }}
            NALA_PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
            NALA_STUDIO_SHARD: ${{ matrix.shard }}
            NALA_SHARD_ID: ${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: mixed-1
                      runner: nala-studio-sj
                      workers: 4
                      node-version: 20.x
                    - shard: mixed-2
                      runner: nala-studio-or
                      workers: 4
                      node-version: 20.x
                    - shard: mixed-3
                      runner: nala-studio-no
                      workers: 3
                      node-version: 20.x
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Single source of truth for the head SHA: the dedup check in
                  # check-approvals resolves it live, and the event payload can be a
                  # stale snapshot on a replayed re-run.
                  ref: ${{ needs.check-approvals.outputs.head-sha }}
                  fetch-depth: 2

            - name: Set up Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Prepare compatible Nala dependencies
              uses: ./.github/actions/setup-nala
              timeout-minutes: 10

            - name: Report shard allocation
              run: |
                  echo "Runner: ${{ matrix.runner }}; shard: ${{ matrix.shard }}; workers: ${{ matrix.workers }}"

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Run Nala Studio Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-studio ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ needs.check-approvals.outputs.head-branch }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ needs.check-approvals.outputs.head-owner }}
                  prRepo: ${{ needs.check-approvals.outputs.head-repo }}
                  prBranch: ${{ needs.check-approvals.outputs.head-branch }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
                  FORCE_COLOR: 3 # Force color output
                  # Authentication and fresh run-scoped HAR seeding happen within this invocation.
                  # No auth state or HAR artifacts are exchanged between jobs or PRs.

            - name: Cleanup cloned cards
              if: always()
              continue-on-error: true
              run: node -e "
                  import('./nala/utils/global.teardown.js')
                  .then(module => module.default())
                  .catch(err => {
                  console.error('::warning::Cleanup failed:', err.message);
                  process.exitCode = 1;
                  });"
              env:
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}

    run-nala-docs-tests:
        # Keep in sync with the check names in .github/actions/resolve-nala-status.
        name: Running Nala Docs E2E UI Tests
        needs: [check-paths, check-approvals, identity]
        if: |
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true' &&
            needs.check-approvals.outputs.already-handled != 'true'
        concurrency:
            group: nala-docs-tests-${{ github.event.pull_request.number }}
            cancel-in-progress: ${{ github.run_attempt > 1 || (github.event_name == 'pull_request' && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala'))) }}
        runs-on: [self-hosted, Linux, X64, nala-docs]
        timeout-minutes: 20 # Prevent hanging jobs
        env:
            NALA_WORKER_COUNT: 1
            NALA_PLAYWRIGHT_WORKERS: 1
            NALA_SHARD_ID: docs-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # See run-nala-studio-tests for why this is not the event payload.
                  ref: ${{ needs.check-approvals.outputs.head-sha }}
                  fetch-depth: 0

            - name: Fetch base branch for diff
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch origin "${BASE_REF}"

            - name: Detect io/www changes
              id: filter
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  if git diff --quiet "origin/${BASE_REF}...HEAD" -- io/www/ 2>/dev/null; then
                      echo "io-www=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "io-www=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Prepare compatible Nala dependencies
              uses: ./.github/actions/setup-nala
              timeout-minutes: 10

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Set MAS_IO_URL when io/www has changes
              if: steps.filter.outputs.io-www == 'true'
              env:
                  ACTOR_NS: ${{ secrets[format('AIO_NS_{0}', needs.identity.outputs.secret_suffix)] }}
                  ACTOR_LOGIN: ${{ github.event.pull_request.user.login }}
                  ACTOR_SUFFIX: ${{ needs.identity.outputs.secret_suffix }}
              run: |
                  if [ -z "$ACTOR_NS" ]; then
                    echo "::error::Missing AIO namespace secret AIO_NS_${ACTOR_SUFFIX} for PR author ${ACTOR_LOGIN}"
                    exit 1
                  fi
                  echo "Using AIO namespace for PR author ${ACTOR_LOGIN}"
                  echo "MAS_IO_URL=?mas-io-url=https://${ACTOR_NS}.adobeioruntime.net/api/v1/web/MerchAtScale" >> "$GITHUB_ENV"

            - name: Run Nala Docs Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-docs ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ needs.check-approvals.outputs.head-branch }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ needs.check-approvals.outputs.head-owner }}
                  prRepo: ${{ needs.check-approvals.outputs.head-repo }}
                  prBranch: ${{ needs.check-approvals.outputs.head-branch }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  FORCE_COLOR: 3 # Force color output

    nala-gate:
        # The only required check in the main ruleset. It never skips, so GitHub's
        # "skipped required check counts as passed" rule can never mask a Nala run
        # that did not happen — unlike the E2E jobs, which skip while approvals are
        # still pending.
        name: Nala Gate
        needs: [cancel-superseded-runs, check-paths, check-approvals, run-nala-studio-tests, run-nala-docs-tests]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 55
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
            # Re-derived here rather than read off check-approvals: re-running only
            # the failed gate reuses that job's outputs, so a gate that went red
            # while approvals were still pending could never turn green without
            # replaying the whole workflow and the whole Nala suite with it.
            - name: Resolve live PR and Nala state
              if: |
                  (needs.cancel-superseded-runs.result == 'success' || needs.cancel-superseded-runs.result == 'skipped') &&
                  needs.check-paths.result == 'success' && needs.check-paths.outputs.is-trivial != 'true'
              id: status
              uses: ./.github/actions/resolve-nala-status
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  required-approvals: ${{ env.REQUIRED_APPROVALS }}
                  consult-prior-runs: 'true'
                  # A superseded run would otherwise report a false 'running' failure.
                  wait-for-in-flight: 'true'
                  # Skipped jobs never executed and may still have pending API check records.
                  ignore-current-run: ${{ needs.run-nala-studio-tests.result == 'skipped' && needs.run-nala-docs-tests.result == 'skipped' }}
                  superseded-runs: ${{ needs.cancel-superseded-runs.outputs.superseded-runs || '[]' }}
                  github-token: ${{ github.token }}
            - name: Resolve Nala status
              env:
                  CANCELLATION_RESULT: ${{ needs.cancel-superseded-runs.result }}
                  PATHS_RESULT: ${{ needs.check-paths.result }}
                  IS_TRIVIAL: ${{ needs.check-paths.outputs.is-trivial }}
                  IS_CURRENT_HEAD: ${{ steps.status.outputs.is-current-head }}
                  HAS_LABEL: ${{ steps.status.outputs.has-label }}
                  CAN_RUN: ${{ steps.status.outputs.can-run }}
                  NALA_CONCLUSION: ${{ steps.status.outputs.nala-conclusion }}
              run: |
                  if [ "$CANCELLATION_RESULT" != "success" ] && [ "$CANCELLATION_RESULT" != "skipped" ]; then
                      echo "::error::Superseded-run cancellation did not succeed (${CANCELLATION_RESULT}); new E2E jobs were not started"
                      exit 1
                  fi
                  if [ "$PATHS_RESULT" != "success" ]; then
                      echo "::error::check-paths did not succeed (${PATHS_RESULT})"
                      exit 1
                  fi
                  # The only bypass is the git-computed is-trivial output, never a mutable label.
                  if [ "$IS_TRIVIAL" = "true" ]; then
                      echo "Trivial PR — Nala not required"
                      exit 0
                  fi
                  if [ "$IS_CURRENT_HEAD" != "true" ]; then
                      echo "::error::This workflow belongs to an older PR commit; use the current commit run"
                      exit 1
                  fi
                  if [ "$HAS_LABEL" != "true" ]; then
                      echo "::error::Add the 'run nala' label to merge this PR"
                      exit 1
                  fi
                  if [ "$CAN_RUN" != "true" ]; then
                      echo "::error::${REQUIRED_APPROVALS} approvals from write-access reviewers are required before the E2E jobs start"
                      exit 1
                  fi
                  case "$NALA_CONCLUSION" in
                      success)
                          echo "Nala passed for this commit"
                          ;;
                      running)
                          echo "::error::Nala is still running for this commit — re-run this job once it finishes"
                          exit 1
                          ;;
                      none)
                          echo "::error::Nala has not run for this commit"
                          exit 1
                          ;;
                      *)
                          echo "::error::Nala did not pass for this commit (${NALA_CONCLUSION})"
                          exit 1
                          ;;
                  esac
