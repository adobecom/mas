<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Merch Card Brand Concierge Product variant test page</title>
        <style>
            main {
                display: flex;
                align-items: flex-start;
                gap: 20px;
                flex-wrap: wrap;
                padding-top: 80px;
            }
            mas-commerce-service {
                display: none;
            }
        </style>
    </head>

    <body>
        <main>
            <div id="container"></div>
        </main>
        <template id="product-card-wide">
            <mas-commerce-service
                env="stage"
                country="US"
                language="en"
            ></mas-commerce-service>
            <merch-card style="width: 378px">
                <aem-fragment fragment="brand-concierge-product"></aem-fragment>
            </merch-card>
        </template>
        <template id="product-card-narrow">
            <mas-commerce-service
                env="stage"
                country="US"
                language="en"
            ></mas-commerce-service>
            <merch-card style="width: 248px">
                <aem-fragment
                    fragment="brand-concierge-product-narrow"
                ></aem-fragment>
            </merch-card>
        </template>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { mockFetch } from './mocks/fetch.js';
            import { mockIms } from './mocks/ims.js';
            import { withWcs } from './mocks/wcs.js';
            import { withAem } from './mocks/aem.js';
            import { getTemplateContent } from './utils.js';
            import '../src/mas.js';
            // Loaded dynamically (not statically) to avoid the
            // variant-layout <-> variants circular-dep deadlock, as in pro.test.js.
            const { BrandConciergeProduct } = await import(
                '../src/variants/brand-concierge-product.js'
            );

            runTests(async () => {
                mockIms();
                await mockFetch(withWcs, withAem);
                const container = document.querySelector('#container');

                describe('merch-card web component with brand-concierge-product variant', () => {
                    beforeEach(() => {
                        container.innerHTML = '';
                    });

                    it('renders icons, price, product description (with link) and promo at the 378px wide breakpoint', async () => {
                        const [masCommerceService, card] =
                            getTemplateContent('product-card-wide');
                        container.append(masCommerceService, card);
                        await card.checkReady();
                        expect(card).to.exist;
                        expect(
                            card.querySelectorAll('[slot="icons"]').length,
                        ).to.equal(2);
                        expect(card.querySelector('[slot="heading-xs"]')).to
                            .exist;
                        const description =
                            card.querySelector('[slot="body-xs"]');
                        expect(description, 'description authored').to.exist;
                        expect(description.querySelector('a')).to.exist;
                        expect(
                            card.shadowRoot.querySelector(
                                'slot[name="body-xs"]',
                            ),
                            'description slot rendered',
                        ).to.exist;
                        const promo = card.querySelector('[slot="promo-text"]');
                        expect(promo).to.exist;
                        expect(promo.querySelector('a')).to.exist;
                        expect(card.querySelector('[slot="promo-link"]')).to.not
                            .exist;
                        expect(card.querySelector('[slot="body-xxs"]')).to.not
                            .exist;
                        expect(card.querySelector('[slot="quantity-select"]'))
                            .to.not.exist;
                        expect(card.secureLabel).to.not.exist;
                    });

                    it('clones the main price into a resolved legal-template sibling', async () => {
                        const [masCommerceService, card] =
                            getTemplateContent('product-card-wide');
                        container.append(masCommerceService, card);
                        await card.checkReady();
                        const legalSelector =
                            '[slot="heading-xs"] [is="inline-price"][data-template="legal"]';
                        let legal;
                        for (let i = 0; i < 50 && !legal; i++) {
                            legal = card.querySelector(legalSelector);
                            if (!legal)
                                await new Promise((r) => setTimeout(r, 20));
                        }
                        expect(legal, 'legal clone inserted').to.exist;
                        const main = card.querySelector(
                            '[slot="heading-xs"] [is="inline-price"][data-template="price"]',
                        );
                        expect(
                            legal.previousElementSibling,
                            'legal clone sits right after the main price',
                        ).to.equal(main);
                    });

                    it('does nothing when there is no main price', async () => {
                        const layout = Object.create(
                            BrandConciergeProduct.prototype,
                        );
                        let inserted = false;
                        layout.card = {
                            id: 'card-1',
                            updateComplete: Promise.resolve(),
                            querySelector: () => null,
                        };
                        await layout.adjustLegal(); // must not throw
                        expect(inserted).to.be.false;
                    });

                    for (const template of [
                        'product-card-wide',
                        'product-card-narrow',
                    ]) {
                        it(`keeps the unit beside the price and the plan on a separate line in ${template}`, async () => {
                            const [masCommerceService, card] =
                                getTemplateContent(template);
                            container.append(masCommerceService, card);
                            await card.checkReady();
                            await card.updateComplete;
                            await card.variantLayout.adjustLegal();
                            const heading = card.querySelector(
                                '[slot="heading-xs"]',
                            );
                            const main = heading.querySelector(
                                '[data-template="price"] .price',
                            );
                            const legal = heading.querySelector(
                                '[data-template="legal"]',
                            );
                            await legal.onceSettled();
                            legal.querySelector('.price-legal').innerHTML =
                                '<span class="price-unit-type">per license</span>' +
                                '<span class="price-tax-inclusivity disabled"></span>' +
                                '<span class="price-plan-type">Annual, billed monthly</span>';
                            const unit =
                                legal.querySelector('.price-unit-type');
                            const plan =
                                legal.querySelector('.price-plan-type');
                            const mainStyle = getComputedStyle(main);
                            const unitStyle = getComputedStyle(unit);
                            const planStyle = getComputedStyle(plan);
                            for (const property of [
                                'fontSize',
                                'lineHeight',
                                'fontWeight',
                                'fontFamily',
                                'color',
                            ]) {
                                expect(unitStyle[property], property).to.equal(
                                    mainStyle[property],
                                );
                            }
                            expect(getComputedStyle(legal).display).to.equal(
                                'inline',
                            );
                            expect(unit.getBoundingClientRect().top).to.equal(
                                main.getBoundingClientRect().top,
                            );
                            expect(planStyle.display).to.equal('block');
                            expect(planStyle.fontWeight).to.equal('400');
                            expect(planStyle.fontSize).to.not.equal(
                                mainStyle.fontSize,
                            );
                            expect(planStyle.marginInlineStart).to.equal('0px');
                            expect(
                                plan.getBoundingClientRect().top,
                            ).to.be.greaterThan(
                                unit.getBoundingClientRect().top,
                            );
                            unit.classList.add('disabled');
                            expect(getComputedStyle(unit).fontWeight).to.equal(
                                '400',
                            );
                        });
                    }

                    it('swallows a clone/resolve failure and leaves the price', async () => {
                        const layout = Object.create(
                            BrandConciergeProduct.prototype,
                        );
                        const price = {
                            dataset: {},
                            cloneNode: () => ({ setAttribute() {} }),
                            onceSettled: () =>
                                Promise.reject(new Error('unpriced')),
                            parentNode: { insertBefore() {} },
                        };
                        layout.card = {
                            id: 'card-1',
                            updateComplete: Promise.resolve(),
                            querySelector: () => price,
                        };
                        await layout.adjustLegal(); // catch swallows the rejection
                        expect(price.dataset.displayTax).to.be.undefined;
                    });

                    it('renders at the 248px narrow breakpoint without quantity-select or secure-label', async () => {
                        const [masCommerceService, card] = getTemplateContent(
                            'product-card-narrow',
                        );
                        container.append(masCommerceService, card);
                        await card.checkReady();
                        expect(card).to.exist;
                        expect(card.querySelector('[slot="promo-text"] a')).to
                            .exist;
                        expect(
                            card.shadowRoot.querySelector(
                                'slot[name="body-xs"]',
                            ),
                        ).to.exist;
                        expect(card.querySelector('[slot="quantity-select"]'))
                            .to.not.exist;
                        expect(
                            card.shadowRoot.querySelector(
                                '.secure-transaction-label',
                            ),
                        ).to.not.exist;
                    });

                    it('keeps the legal plan type unindented with or without per-unit text', async () => {
                        const [masCommerceService, card] =
                            getTemplateContent('product-card-wide');
                        container.append(masCommerceService, card);
                        await card.checkReady();
                        const planTypeMargin = (unitClass) => {
                            const legal = document.createElement('span');
                            legal.dataset.template = 'legal';
                            legal.innerHTML = `<span class="price-unit-type ${unitClass}">per license</span><span class="price-plan-type">Annual, billed monthly</span>`;
                            card.querySelector('[slot="heading-xs"]').append(
                                legal,
                            );
                            return getComputedStyle(
                                legal.querySelector('.price-plan-type'),
                            ).marginInlineStart;
                        };
                        expect(planTypeMargin('')).to.equal('0px');
                        expect(planTypeMargin('disabled')).to.equal('0px');
                    });
                });
            });
        </script>
    </body>
</html>
