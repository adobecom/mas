<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Merch addon web component test page</title>
        <style>
            main {
                display: flex;
                align-items: center;
                gap: 20px;
                flex-direction: column;
                padding-top: 80px;
            }
            mas-commerce-service {
                display: none;
            }
        </style>
    </head>

    <body>
        <main></main>
        <template id="ai">
            <mas-commerce-service env="stage"></mas-commerce-service>
            <merch-addon>
                <p><strong>Acrobat AI Assistant</strong></p>
                <p data-plan-type="">
                    Add AI Assistant to your free Reader app for
                    <span
                        is="inline-price"
                        data-template="price"
                        data-wcs-osi="puf-team"
                    ></span>
                </p>
                <p data-plan-type="">
                    Add AI Assistant to your free Reader app for
                    <span
                        is="inline-price"
                        data-template="price"
                        data-wcs-osi="abm"
                    ></span>
                </p>
                <p data-plan-type="">
                    Add AI Assistant to your free Reader app for
                    <span
                        is="inline-price"
                        data-template="price"
                        data-wcs-osi="m2m"
                    ></span>
                </p>
                <merch-gradient
                    colors="#F5F6FD, #F8F1F8, #F9E9ED"
                    positions="33.52%, 67.33%, 110.37%"
                    angle="211deg"
                    border-radius="10px"
                ></merch-gradient>
            </merch-addon>
        </template>
        <template id="two-plan-cards">
            <mas-commerce-service env="stage"></mas-commerce-service>
            <merch-card>
                <p class="card-heading">Acrobat Pro</p>
                <merch-addon custom-checkbox>
                    <p>Add AI Assistant to your Acrobat plan for US$1.99/mo.</p>
                </merch-addon>
            </merch-card>
            <merch-card>
                <p class="card-heading">Creative Cloud Pro</p>
                <merch-addon custom-checkbox>
                    <p>Add AI Assistant to your Acrobat plan for US$1.99/mo.</p>
                </merch-addon>
            </merch-card>
        </template>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { mockFetch } from './mocks/fetch.js';
            import { mockIms } from './mocks/ims.js';
            import { withWcs } from './mocks/wcs.js';
            import { withAem } from './mocks/aem.js';
            import { delay, getTemplateContent } from './utils.js';
            import '../src/mas.js';

            runTests(async () => {
                mockIms();
                await mockFetch(withWcs, withAem);
                const container = document.querySelector('main');

                describe('merch-addon web component', async () => {
                    beforeEach(() => {
                        container.innerHTML = '';
                    });
                    it('should set --merch-addon-background CSS var when background attribute is present', async () => {
                        const el = document.createElement('merch-addon');
                        const gradient =
                            'linear-gradient(211deg, rgb(245, 246, 253) 33.52%, rgb(248, 241, 248) 67.33%, rgb(249, 233, 237) 110.37%)';
                        el.setAttribute('background', gradient);
                        container.append(el);
                        await el.updateComplete;
                        expect(
                            el.style.getPropertyValue(
                                '--merch-addon-background',
                            ),
                        ).to.equal(gradient);
                    });

                    it('should not set --merch-addon-background when no background attribute', async () => {
                        const el = document.createElement('merch-addon');
                        container.append(el);
                        await el.updateComplete;
                        expect(
                            el.style.getPropertyValue(
                                '--merch-addon-background',
                            ),
                        ).to.equal('');
                    });

                    it('should render addon checkbox and update on plan type change', async () => {
                        const [masCommerceService, ai] =
                            getTemplateContent('ai');
                        container.append(masCommerceService, ai);
                        expect(ai).to.exist;
                        await delay(50); // time to render prices
                        expect(ai.innerText).to.contain('Acrobat AI Assistant');
                        ai.planType = 'PUF';
                        await ai.updateComplete;
                        await delay(50);
                        // The inline-price is hidden for TRIAL offer types
                        expect(ai.innerText).to.contain('free Reader app');
                        expect(ai.getOsi('ABM', 'BASE')).to.be.equal('abm');
                        // fallback to BASE, if PROMOTION is not available
                        expect(ai.getOsi('ABM', 'PROMOTION')).to.be.equal(
                            'abm',
                        );
                        // fallback to TRIAL, if BASE & PROMOTION aren't available
                        expect(ai.getOsi('PUF', 'BASE')).to.be.equal(
                            'puf-team',
                        );
                        ai.planType = 'ABM';
                        await ai.updateComplete;
                        expect(ai.innerText).to.contain('US$54.99/mo');
                        ai.planType = 'M2M';
                        await ai.updateComplete;
                        expect(ai.innerText).to.contain('US$82.49/mo');
                    });

                    it('gives identically worded add-on checkboxes on different cards distinct accessible names', async () => {
                        const [masCommerceService, cardA, cardB] =
                            getTemplateContent('two-plan-cards');
                        container.append(masCommerceService, cardA, cardB);
                        await cardA.updateComplete;
                        await cardB.updateComplete;

                        const authoredText =
                            'Add AI Assistant to your Acrobat plan for US$1.99/mo.';
                        const addonA = cardA.querySelector('merch-addon');
                        const addonB = cardB.querySelector('merch-addon');
                        await addonA.updateComplete;
                        await addonB.updateComplete;

                        const labelA = addonA.shadowRoot.getElementById(
                            'custom-checkbox-label',
                        );
                        const labelB = addonB.shadowRoot.getElementById(
                            'custom-checkbox-label',
                        );
                        const normalize = (text) =>
                            text.replace(/\s+/g, ' ').trim();
                        const nameA = normalize(labelA.innerText);
                        const nameB = normalize(labelB.innerText);

                        expect(nameA).to.not.equal(nameB);
                        expect(nameA).to.contain('Acrobat Pro');
                        expect(nameB).to.contain('Creative Cloud Pro');
                        expect(nameA).to.contain(authoredText);
                        expect(nameB).to.contain(authoredText);

                        // visible authored text must remain unchanged
                        expect(
                            normalize(addonA.querySelector('p').textContent),
                        ).to.equal(authoredText);
                        expect(
                            normalize(addonB.querySelector('p').textContent),
                        ).to.equal(authoredText);

                        // the product-name text is exposed to the accessible
                        // name only, never painted
                        const span = labelA.querySelector('.addon-plan-name');
                        expect(span).to.exist;
                        const cs = getComputedStyle(span);
                        expect(cs.display).to.not.equal('none');
                        expect(cs.visibility).to.not.equal('hidden');
                        expect(
                            span.getBoundingClientRect().width,
                        ).to.be.at.most(1);
                    });

                    it('falls back to the authored-only accessible name when there is no host card', async () => {
                        const el = document.createElement('merch-addon');
                        el.setAttribute('custom-checkbox', '');
                        el.innerHTML =
                            '<p>Add AI Assistant to your Acrobat plan for US$1.99/mo.</p>';
                        container.append(el);
                        await el.updateComplete;

                        const label = el.shadowRoot.getElementById(
                            'custom-checkbox-label',
                        );
                        expect(label.querySelector('.addon-plan-name')).to.not
                            .exist;
                        expect(
                            label.innerText.replace(/\s+/g, ' ').trim(),
                        ).to.equal(
                            'Add AI Assistant to your Acrobat plan for US$1.99/mo.',
                        );
                    });
                });
            });
        </script>
    </body>
</html>
