name: Nala Execution

# This is a REUSABLE workflow (workflow_call only, no direct triggers) — it holds the actual Nala
# jobs and the repo-wide serialization lock. It is invoked by run-nala.yml, which is the thin
# dispatcher that owns the pull_request trigger and the PER-PR cancel-on-repush concurrency group.
# Splitting it this way lets us have BOTH concurrency behaviors at once (GitHub only allows one
# group + one cancel-in-progress policy per workflow level, so one group can't do both):
#   - run-nala.yml's group is scoped to `github.ref` with cancel-in-progress: true, so a re-push
#     to a PR safely cancels only THAT PR's own previous run (and, because cancelling a run
#     cancels everything running under it, that cascades down and cancels this reusable workflow's
#     jobs too).
#   - This file's group below is repo-wide (no ref) with cancel-in-progress: false, so a
#     DIFFERENT PR's run queues (never cancels) behind whichever run currently holds the lock.
on:
    workflow_call:

# Serialize ENTIRE Nala runs repo-wide (NOT scoped by github.ref/PR) so at most one PR's full run
# (all 3 studio shards + docs) is ever sending traffic at once. This is what makes the static EDS
# 200 rps / ODIN 20 rps budget (divided by NALA_TOTAL_WORKERS across the 4 jobs, see
# run-nala-studio-tests / run-nala-docs-tests below) always valid, regardless of whether another
# PR's run could otherwise start as soon as one shard/job of the current run finishes (this was
# previously unclear/unverified — this makes it a non-issue rather than something to detect).
# Concurrency at this (workflow) level queues whole RUNS, not individual jobs — so the 4 jobs
# within ONE run still execute in parallel with each other; only a DIFFERENT run (any other PR)
# waits for the currently running one to fully finish. A re-push to THIS same PR is handled by
# run-nala.yml's own cancel-on-repush group instead (see above), not by this one.
concurrency:
    group: nala-tests
    cancel-in-progress: false

jobs:
    nala-gate:
        name: Nala Gate
        runs-on: ubuntu-latest
        steps:
            - name: Require 'run nala' label
              # Only enforce label requirement for synchronize events, not when PR is first opened
              if: |
                  github.event.action != 'opened' &&
                  !contains(github.event.pull_request.labels.*.name, 'run nala')
              run: |
                  echo "::error::Add the 'run nala' label to merge this PR"
                  exit 1

    run-nala-studio-tests:
        name: Running Nala Studio [${{ matrix.shard }}] E2E UI Tests
        needs: nala-gate
        if: |
            github.event.action == 'opened' ||
            contains(github.event.pull_request.labels.*.name, 'run nala')
        # gh CLI needs `actions: write` to read/write the shared NALA_PAUSE_* repository
        # variables used for cross-run 429 pause propagation (nala/libs/shared-pause-state.js).
        permissions:
            actions: write
            contents: read
        runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
        timeout-minutes: 30
        # Each shard is pinned to its runner via matrix.runner (unique label per machine). All
        # shards + docs share ONE User-Agent (playwright.config.js) and ONE 200 rps EDS / 20 rps
        # ODIN budget — see NALA_TOTAL_WORKERS below. Working hypothesis: EDS/ODIN enforce these
        # limits per TENANT (the PR preview hostname all 4 jobs test identically — confirmed via
        # nala/utils/global.setup.js), not per client IP, so the grouping is "all jobs testing
        # this PR" rather than "jobs on the same machine/IP". nala-studio-no and nala-docs run on
        # separate VMs that happen to share a public IP — that's incidental to this budget
        # grouping too (all 4 jobs share it regardless of IP, under the tenant hypothesis above).
        # If EDS/ODIN turn out to rate-limit per source IP instead, the no/docs IP overlap
        # would become directly relevant (they'd need to share a sub-pool together regardless of
        # tenant), while sj/or (if on distinct IPs) could each get independent pools — see the
        # per-IP-vs-tenant discussion; this has not been confirmed either way.
        # The workflow-level `concurrency:` block at the top of this file (repo-wide, not per-PR)
        # is what keeps this fixed 12-worker pool valid regardless of which hypothesis is true: it
        # guarantees only one PR's full Nala run is ever active, so no other PR's shards/docs can
        # be sending traffic concurrently.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: acom-ahome
                      node-version: 20.x
                      dirs: nala/studio/acom nala/studio/ahome
                      runner: nala-studio-sj # San Jose
                      workers: 4
                    - shard: ccd-commerce
                      node-version: 20.x
                      dirs: nala/studio/ccd nala/studio/commerce
                      runner: nala-studio-or # Oregon
                      workers: 4
                    - shard: rest
                      node-version: 20.x
                      runner: nala-studio-no # Noida
                      workers: 3
                      # dirs intentionally omitted — auto-discovered at runtime
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Resolve shard directories
              run: |
                  if [ -n "${{ matrix.dirs }}" ]; then
                    echo "SHARD_DIRS=${{ matrix.dirs }}" >> $GITHUB_ENV
                  else
                    # Shard 3 catch-all: every studio dir/file not claimed by shards 1-2.
                    # New directories are automatically included here — no workflow change needed.
                    CLAIMED="nala/studio/acom nala/studio/ahome nala/studio/ccd nala/studio/commerce"
                    DIRS=""
                    for path in nala/studio/*/; do
                      dir="${path%/}"
                      echo "$CLAIMED" | grep -qw "$dir" || DIRS="$DIRS $dir"
                    done
                    for f in nala/studio/*.test.js; do
                      [ -f "$f" ] && DIRS="$DIRS $f"
                    done
                    echo "SHARD_DIRS=$(echo $DIRS | xargs)" >> $GITHUB_ENV
                  fi

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            - name: Install Playwright system dependencies
              uses: ./.github/actions/prep-apt

            - name: Install/verify Playwright browsers
              run: |
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Run Nala Studio Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-studio ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
                  FORCE_COLOR: 3 # Force color output
                  # Workers per shard declared in matrix (see above).
                  NALA_PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
                  # Single shared tenant-wide budget pool: sj(4) + or(4) + no(3) + docs(1).
                  # Keep in sync with the `workers:` values above and the docs job below.
                  NALA_TOTAL_WORKERS: 12
                  # Label only (log/display), no longer used to vary the UA — one shared UA is
                  # used everywhere (playwright.config.js), so ODIN's 20 rps/UA cap is a single
                  # global pool too.
                  NALA_SHARD_ID: ${{ matrix.shard }}-${{ github.run_id }}
                  # `gh` (used by nala/libs/shared-pause-state.js for cross-run 429 propagation)
                  # authenticates via GH_TOKEN.
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Cleanup cloned cards
              if: always()
              run: node -e "
                  import('./nala/utils/global.teardown.js')
                  .then(module => module.default())
                  .catch(err => {
                  console.error('Cleanup failed:', err.message);
                  process.exit(1);
                  });"
              env:
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}

    run-nala-docs-tests:
        name: Running Nala Docs E2E UI Tests
        needs: nala-gate
        # Run when PR is opened (no label needed) OR when 'run nala' label exists
        # This covers: opened (always), synchronize (if label exists), labeled (if label exists)
        if: |
            github.event.action == 'opened' ||
            contains(github.event.pull_request.labels.*.name, 'run nala')
        # `actions: write` lets gh CLI read/write the shared NALA_PAUSE_* repo variables used for
        # cross-run 429 pause propagation (see nala/libs/shared-pause-state.js). The repo-wide
        # `concurrency:` block at the top of this file (not a custom step here) is what guarantees
        # only one PR's full Nala run — this job included — is ever active at a time.
        permissions:
            actions: write
            contents: read
        runs-on: [self-hosted, Linux, X64, nala-docs]
        timeout-minutes: 20 # Prevent hanging jobs
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch base branch for diff
              run: git fetch origin ${{ github.event.pull_request.base.ref }}

            - name: Detect io/www changes
              id: filter
              run: |
                  if git diff --quiet origin/${{ github.event.pull_request.base.ref }}...HEAD -- io/www/ 2>/dev/null; then
                      echo "io-www=false" >> $GITHUB_OUTPUT
                  else
                      status=$?
                      if [ "$status" -eq 1 ]; then
                          echo "io-www=true" >> $GITHUB_OUTPUT
                      else
                          echo "io-www=false" >> $GITHUB_OUTPUT
                      fi
                  fi

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            # Docs tests run on GitHub-hosted runners (ubuntu-latest) — no unattended-upgrades
            # lock contention, so the prep-apt composite action is not needed here.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install-deps

            - name: Install/verify Playwright browsers
              run: |
                  # Always run this - it's idempotent and fast when browsers are already correct
                  # It checks version compatibility and only installs if browsers are missing or outdated
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Set MAS_IO_URL when io/www has changes
              if: steps.filter.outputs.io-www == 'true'
              run: |
                  if [ -z "${{ secrets.AIO_WWW_NS }}" ]; then
                    echo "::error::Missing required secret: AIO_WWW_NS"
                    exit 1
                  fi
                  ACTOR_NS="${{ secrets.AIO_WWW_NS }}-${{ github.event.pull_request.user.login }}"
                  echo "Using AIO namespace: PR author (${{ github.event.pull_request.user.login }})"
                  echo "MAS_IO_URL=?mas-io-url=https://${ACTOR_NS}.adobeioruntime.net/api/v1/web/MerchAtScale" >> $GITHUB_ENV

            - name: Run Nala Docs Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-docs ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  FORCE_COLOR: 3 # Force color output
                  # This job runs on a separate VM from nala-studio-no that happens to share its
                  # public IP, but that's not why it shares a budget with it — see the tenant-wide
                  # rationale in run-nala-studio-tests's matrix comment above. This job tests the
                  # exact same PR preview hostname as all 3 studio shards, so it shares ONE pool
                  # with all of them, not just with the no shard. The repo-wide `concurrency:`
                  # block at the top of this file keeps that pool valid across concurrent PRs.
                  NALA_PLAYWRIGHT_WORKERS: 1
                  # Single shared tenant-wide budget pool: sj(4) + or(4) + no(3) + docs(1).
                  # Keep in sync with the studio job's NALA_TOTAL_WORKERS.
                  NALA_TOTAL_WORKERS: 12
                  # Label only (log/display), no longer used to vary the UA — one shared UA is
                  # used everywhere (playwright.config.js).
                  NALA_SHARD_ID: docs-${{ github.run_id }}
                  # `gh` (used by nala/libs/shared-pause-state.js for cross-run 429 propagation)
                  # authenticates via GH_TOKEN.
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
