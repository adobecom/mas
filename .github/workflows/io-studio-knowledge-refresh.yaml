name: IO Studio Knowledge Refresh

on:
    schedule:
        - cron: '17 7 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: io-studio-knowledge-refresh
    cancel-in-progress: false

jobs:
    validate:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: io/studio
        outputs:
            sha256: ${{ steps.snapshot.outputs.sha256 }}
            revision: ${{ steps.snapshot.outputs.revision }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.23.1'
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - name: Mint a mas-agent read token
              id: masa-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.MAS_AGENT_READER_APP_ID }}
                  private-key: ${{ secrets.MAS_AGENT_READER_APP_KEY }}
                  owner: adobecom
                  repositories: mas-agent
                  permission-contents: read
            - name: Validate the current author export and Studio behavior
              env:
                  MAS_AGENT_KNOWLEDGE_TOKEN: ${{ steps.masa-token.outputs.token }}
              run: npm test
            - name: Record the tested snapshot
              id: snapshot
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync } from 'node:fs';
                  import { MASA_KNOWLEDGE } from './src/ai-chat/masa-knowledge.js';
                  const { revision, sha256, chunks } = MASA_KNOWLEDGE;
                  if (!/^[a-f0-9]{64}$/.test(sha256) || !/^[a-f0-9]{7,40}$/.test(revision)) {
                      throw new Error('A release revision and digest are required for automated refresh');
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\nrevision=${revision}\n`);
                  appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                      `Validated mas-agent revision \`${revision}\` (${chunks.length} chunks).\n\nSHA-256: \`${sha256}\`\n`);
                  NODE

    deploy_stage:
        needs: validate
        uses: ./.github/workflows/io-studio-deploy.yaml
        with:
            assistant_only: true
            run_tests: false
            knowledge_sha256: ${{ needs.validate.outputs.sha256 }}
            vault-path: merch-at-scale/aio-studio/stage
        secrets: inherit

    test_stage:
        needs: deploy_stage
        uses: ./.github/workflows/io-studio-tests.yaml
        with:
            namespace: ${{ needs.deploy_stage.outputs.namespace }}

    deploy_production:
        needs: [validate, test_stage]
        uses: ./.github/workflows/io-studio-deploy.yaml
        with:
            assistant_only: true
            run_tests: false
            knowledge_sha256: ${{ needs.validate.outputs.sha256 }}
            vault-path: merch-at-scale/aio-studio/prod
        secrets: inherit

    test_production:
        needs: deploy_production
        uses: ./.github/workflows/io-studio-tests.yaml
        with:
            namespace: ${{ needs.deploy_production.outputs.namespace }}
