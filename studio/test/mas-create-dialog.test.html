<!doctype html>
<html>
    <head>
        <script>
            window.__swc = { warn: () => {} };
        </script>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <title>mas-create-dialog test page</title>
        <meta name="nofollow-links" content="on" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../../style.css" />
        <style>
            body {
                margin: 32px;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: white;
            }

            main {
                width: 100%;
                padding: 0 100px;
            }

            sp-theme {
                display: contents;
            }
        </style>
    </head>
    <body>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { createSandbox, stub } from 'sinon';

            import Store from '../src/store.js';
            import Events from '../src/events.js';
            import router from '../src/router.js';
            import { COMPAT_VERSION, TAG_MERCH_CARD, TAG_MODEL_ID_MAPPING } from '../src/constants.js';
            import { delay } from './utils.js';
            import '../libs/swc.js';
            import '../../src/mas-create-dialog.js';
            import '../../src/mas-repository.js';
            runTests(async () => {
                describe('mas-create-dialog custom element', async () => {
                    let dialog;
                    let fetchStub;

                    beforeEach(async () => {
                        dialog = document.querySelector('mas-create-dialog');
                        // Set the type property directly since it's now passed from the parent
                        dialog.type = 'merch-card';
                        await dialog.updateComplete;

                        // Mock fetch API
                        fetchStub = stub(window, 'fetch').resolves({
                            ok: true,
                            headers: {
                                get() {},
                            },
                            json: () => Promise.resolve({ success: true }),
                        });
                    });

                    afterEach(() => {
                        fetchStub.restore();
                    });

                    describe('baseline PA code validation', () => {
                        let dialog;
                        let service;
                        let sandbox;

                        beforeEach(async () => {
                            sandbox = createSandbox();
                            dialog = document.querySelector('mas-create-dialog');
                            dialog.close();
                            dialog.type = 'baseline';
                            dialog.title = 'Test Baseline';
                            Store.search.set((prev) => ({ ...prev, path: 'acom' }));
                            service = document.createElement('mas-commerce-service');
                            service.collectPriceOptions = sandbox.stub().returns({});
                            service.resolveOfferSelectors = sandbox.stub();
                            document.body.append(service);
                            await dialog.updateComplete;
                        });

                        afterEach(() => {
                            sandbox.restore();
                            service.remove();
                            dialog.close();
                        });

                        const stubBaselineCreation = () => {
                            const repository = document.querySelector('mas-repository');
                            return {
                                ensureFolderExists: sandbox
                                    .stub(repository.aem.sites.cf.fragments, 'ensureFolderExists')
                                    .resolves(),
                                createFragment: sandbox.stub(repository, 'createFragment').resolves({ id: 'baseline-id' }),
                            };
                        };

                        const expectNoBaselineCreated = ({ ensureFolderExists, createFragment }) => {
                            expect(ensureFolderExists.called).to.be.false;
                            expect(createFragment.called).to.be.false;
                        };

                        it('reports a failed PA code lookup inline only and clears the PA code', async () => {
                            const toast = sandbox.stub(Events.toast, 'emit');
                            service.resolveOfferSelectors.returns([Promise.reject(new Error('Lookup failed'))]);
                            dialog.productArrangementCode = 'PREVIOUS-PA';

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: {} },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('');
                            expect(dialog.errors.offer).to.equal('No PA code found for this offer');
                            expect(toast.called).to.be.false;
                        });

                        it('shows the missing PA code error when submitting before the lookup finishes', async () => {
                            service.resolveOfferSelectors.returns([new Promise(() => {})]);
                            dialog.template = 'catalog';
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: {} },
                                }),
                            );
                            const creation = stubBaselineCreation();

                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            expectNoBaselineCreated(creation);
                            expect(dialog.loading).to.be.false;
                            expect(dialog.shadowRoot.querySelector('#offer-error').textContent.trim()).to.equal(
                                'No PA code found for this offer',
                            );
                        });

                        it('uses the resolved PA code for the selected offer', async () => {
                            service.resolveOfferSelectors.returns([Promise.resolve([{ productArrangementCode: 'PA-123' }])]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: {} },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('PA-123');
                        });

                        it('shows an offer error when the selected offer has no PA code', async () => {
                            service.resolveOfferSelectors.returns([Promise.resolve([{}])]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: {} },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('');
                            expect(dialog.shadowRoot.querySelector('#offer-error').textContent.trim()).to.equal(
                                'No PA code found for this offer',
                            );
                        });

                        it('rejects a title without letters or digits', async () => {
                            dialog.title = '!!!';
                            const creation = stubBaselineCreation();

                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            const titleField = dialog.shadowRoot.querySelector('#fragment-title');
                            expectNoBaselineCreated(creation);
                            expect(dialog.loading).to.be.false;
                            expect(titleField.getAttribute('aria-describedby')).to.equal('title-error');
                            expect(dialog.shadowRoot.querySelector('#title-error').textContent.trim()).to.equal(
                                'Title must contain letters or digits',
                            );
                        });

                        it('marks the template picker invalid when no template is selected', async () => {
                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            expect(dialog.shadowRoot.querySelector('variant-picker').invalid).to.be.true;
                        });

                        it('blocks baseline creation without a PA code', async () => {
                            dialog.osi = 'ABC123';
                            dialog.template = 'catalog';
                            const creation = stubBaselineCreation();

                            await dialog.handleSubmit();

                            expectNoBaselineCreated(creation);
                            expect(dialog.loading).to.be.false;
                        });

                        it('resets offer selector state on close', () => {
                            dialog.offerSelectorOpened = true;

                            dialog.close();

                            expect(dialog.offerSelectorOpened).to.be.false;
                        });

                        it('resets the product code on close', () => {
                            dialog.productCode = 'CCSN';

                            dialog.close();

                            expect(dialog.productCode).to.equal('');
                        });

                        it('stores the product code carried by the selected offer', async () => {
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: {
                                        offerSelectorId: 'ABC123',
                                        offer: { productArrangementCode: 'PA-1', product_code: 'CCSN' },
                                    },
                                }),
                            );
                            await delay();

                            expect(dialog.productCode).to.equal('CCSN');
                        });

                        it('takes the product code from the WCS lookup', async () => {
                            service.resolveOfferSelectors.returns([
                                Promise.resolve([
                                    { productArrangementCode: 'PA-1', productArrangement: { productCode: 'PHSP' } },
                                ]),
                            ]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'ABC123', offer: {} } }),
                            );
                            await delay();

                            expect(dialog.productCode).to.equal('PHSP');
                        });

                        it('clears the previous product code while the new offer lookup is pending', async () => {
                            service.resolveOfferSelectors.returns([new Promise(() => {})]);
                            dialog.productCode = 'OLD';

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'ABC123', offer: {} } }),
                            );
                            await delay();

                            expect(dialog.productCode).to.equal('');
                        });

                        it('exposes accessible labels and errors on an empty offer', async () => {
                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            const root = dialog.shadowRoot;
                            const offerButton = root.querySelector('[aria-labelledby="offer-label"] sp-action-button');
                            expect(root.querySelector('#offer-label').textContent.trim()).to.equal('Offer');
                            expect(offerButton.getAttribute('aria-invalid')).to.equal('true');
                            expect(offerButton.classList.contains('invalid')).to.be.true;
                            expect(offerButton.getAttribute('aria-describedby')).to.equal('offer-error');
                            expect(root.querySelector('#offer-error').textContent.trim()).to.equal('Select an offer');
                        });

                        it('labels the template picker and describes its error', async () => {
                            await dialog.handleSubmit();
                            await dialog.updateComplete;
                            const template = dialog.shadowRoot.querySelector('variant-picker#template');
                            await template.updateComplete;
                            const picker = template.shadowRoot.querySelector('sp-picker');
                            await picker.updateComplete;

                            expect(dialog.shadowRoot.querySelector('#template-label').getAttribute('for')).to.equal('template');
                            expect(picker.shadowRoot.querySelector('#applied-label').textContent.trim()).to.equal('Template');
                            expect(template.shadowRoot.querySelector('[slot="description"]').textContent.trim()).to.equal(
                                'Select a template',
                            );
                        });

                        it('announces field errors through polite live regions', async () => {
                            dialog.title = '';

                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            for (const id of ['title-error', 'offer-error']) {
                                const region = dialog.shadowRoot.querySelector(`#${id}`).closest('.field-message');
                                expect(region.getAttribute('aria-live')).to.equal('polite');
                            }
                        });

                        it('hides the visible template error from assistive tech since the picker describes it', async () => {
                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            const region = dialog.shadowRoot.querySelector('#template-error').closest('.field-message');
                            expect(region.getAttribute('aria-hidden')).to.equal('true');
                            expect(region.hasAttribute('aria-live')).to.be.false;
                        });

                        it('keeps the offer button and relabels it once an offer is selected', async () => {
                            const selectButton = dialog.shadowRoot.querySelector(
                                '[aria-labelledby="offer-label"] sp-action-button',
                            );
                            expect(selectButton.textContent.trim()).to.equal('Select offer…');

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: { productArrangementCode: 'PA-1' } },
                                }),
                            );
                            await delay();

                            const changeButton = dialog.shadowRoot.querySelector(
                                '[aria-labelledby="offer-label"] sp-action-button',
                            );
                            expect(changeButton).to.equal(selectButton);
                            expect(changeButton.textContent.trim()).to.equal('Change offer');
                        });

                        it('does not render a surface picker', () => {
                            expect(dialog.shadowRoot.querySelector('#surface')).to.not.exist;
                        });

                        describe('on create', () => {
                            let fragments;
                            let repository;
                            let tagExists;

                            beforeEach(() => {
                                repository = document.querySelector('mas-repository');
                                fragments = repository.aem.sites.cf.fragments;
                                tagExists = sandbox.stub(repository.aem.tags, 'exists').resolves(true);
                                sandbox.stub(console, 'error');
                                sandbox.stub(router, 'navigateToFragmentEditor').resolves();
                                dialog.osi = 'ABC123';
                                dialog.productArrangementCode = 'ccsn_direct_individual';
                                dialog.productCode = 'CCSN';
                                Store.search.set((prev) => ({ ...prev, path: 'sandbox' }));
                                dialog.template = 'catalog';
                            });

                            it('creates the baseline in the selected locale and market segment folder', async () => {
                                const ensureFolderExists = sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                const create = sandbox.stub(repository, 'createFragment').resolves({ id: 'baseline-id' });
                                Store.filters.set((prev) => ({ ...prev, locale: 'fr_FR' }));
                                dialog.marketSegment = 'EDU';

                                await dialog.handleSubmit();
                                Store.filters.set((prev) => ({ ...prev, locale: 'en_US' }));

                                const folder = '/content/dam/mas/sandbox/fr_FR/baselines/catalog/ccsn_direct_individual/edu';
                                expect(ensureFolderExists.calledOnceWithExactly(folder)).to.be.true;
                                expect(create.firstCall.args[0].parentPath).to.equal(folder);
                            });

                            it('ensures the baseline folder and checks for the baseline in the selected surface', async () => {
                                const ensureFolderExists = sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                const getByPath = sandbox.stub(fragments, 'getByPath').resolves({ path: 'existing' });

                                await dialog.handleSubmit();

                                expect(
                                    ensureFolderExists.calledOnceWithExactly(
                                        '/content/dam/mas/sandbox/en_US/baselines/catalog/ccsn_direct_individual',
                                    ),
                                ).to.be.true;
                                expect(getByPath.calledOnce).to.be.true;
                                expect(getByPath.firstCall.args[0]).to.equal(
                                    '/content/dam/mas/sandbox/en_US/baselines/catalog/ccsn_direct_individual/baseline',
                                );
                            });

                            it('shows the existing baseline error on the offer field and does not create', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox.stub(fragments, 'getByPath').resolves({ path: 'existing' });
                                const create = sandbox.stub(repository, 'createFragment');
                                dialog.title = 'Test Baseline';

                                await dialog.handleSubmit();
                                await dialog.updateComplete;
                                const root = dialog.shadowRoot;
                                const offerButton = root.querySelector('[aria-labelledby="offer-label"] sp-action-button');

                                expect(create.called).to.be.false;
                                expect(dialog.loading).to.be.false;
                                expect(root.querySelector('#offer-error').textContent.trim()).to.equal(
                                    'The baseline for this product code and market segment already exists.',
                                );
                                expect(offerButton.getAttribute('aria-invalid')).to.equal('true');
                                expect(root.querySelector('#title-error')).to.not.exist;
                                expect(root.querySelector('#fragment-title').invalid).to.be.false;
                            });

                            it('creates the baseline without tags that do not exist and shows no error', async () => {
                                tagExists.resolves(false);
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                const create = sandbox.stub(repository, 'createFragment').resolves({ id: 'baseline-id' });

                                await dialog.handleSubmit();

                                expect(create.firstCall.args[0].tags).to.deep.equal([]);
                                expect(dialog.errors.offer).to.equal('');
                            });

                            it('creates a Card fragment in the baseline folder', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                const create = sandbox.stub(repository, 'createFragment').resolves({
                                    id: 'baseline-id',
                                    path: '/content/dam/mas/sandbox/en_US/baselines/catalog/ccsn_direct_individual/test-baseline',
                                });

                                await dialog.handleSubmit();

                                expect(create.calledOnce).to.be.true;
                                expect(create.firstCall.args[0]).to.deep.equal({
                                    modelId: TAG_MODEL_ID_MAPPING[TAG_MERCH_CARD],
                                    title: 'Test Baseline',
                                    name: 'baseline',
                                    parentPath: '/content/dam/mas/sandbox/en_US/baselines/catalog/ccsn_direct_individual',
                                    tags: [
                                        '/content/cq:tags/mas/product_code/ccsn',
                                        '/content/cq:tags/mas/market_segments/com',
                                        '/content/cq:tags/mas/product_arrangement_code/ccsn_direct_individual',
                                    ],
                                    data: {
                                        osi: 'ABC123',
                                        cardTitle: 'Test Baseline',
                                        variant: 'catalog',
                                        compatVersion: COMPAT_VERSION,
                                    },
                                });
                            });

                            it('opens the created baseline in the fragment editor of the current surface', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                sandbox.stub(repository, 'createFragment').resolves({
                                    id: 'baseline-id',
                                    path: '/content/dam/mas/sandbox/en_US/baselines/catalog/ccsn_direct_individual/test-baseline',
                                });
                                const closed = sandbox.spy();
                                dialog.addEventListener('close', closed, { once: true });

                                await dialog.handleSubmit();

                                expect(Store.search.value.path).to.equal('sandbox');
                                expect(closed.calledOnce).to.be.true;
                                expect(router.navigateToFragmentEditor.calledOnceWithExactly('baseline-id')).to.be.true;
                            });

                            it('keeps the search surface when the baseline is not created', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                sandbox.stub(repository, 'createFragment').rejects(new Error('Create failed'));

                                await dialog.handleSubmit();

                                expect(Store.search.value.path).to.equal('sandbox');
                            });

                            it('reports a 409 conflict as an existing baseline for the PA code and segment', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                sandbox
                                    .stub(repository, 'createFragment')
                                    .rejects(new Error('Failed to create fragment: 409 Conflict'));
                                const toast = sandbox.stub(Events.toast, 'emit');

                                await dialog.handleSubmit();

                                expect(
                                    toast.calledOnceWithExactly({
                                        variant: 'negative',
                                        content: 'The baseline for this product code and market segment already exists.',
                                    }),
                                ).to.be.true;
                                expect(dialog.loading).to.be.false;
                            });

                            it('reports that the baseline was created when navigation fails', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                sandbox.stub(repository, 'createFragment').resolves({ id: 'baseline-id' });
                                router.navigateToFragmentEditor.rejects(new Error('Navigation failed'));
                                const toast = sandbox.stub(Events.toast, 'emit');

                                await dialog.handleSubmit();

                                expect(
                                    toast.calledOnceWithExactly({
                                        variant: 'negative',
                                        content: 'Baseline was created but could not be opened: Navigation failed',
                                    }),
                                ).to.be.true;
                                expect(dialog.loading).to.be.false;
                            });

                            it('stays open when the repository does not create the fragment', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').resolves(true);
                                sandbox
                                    .stub(fragments, 'getByPath')
                                    .rejects(Object.assign(new Error('Fragment not found'), { status: 404 }));
                                sandbox.stub(repository, 'createFragment').resolves(undefined);

                                await dialog.handleSubmit();

                                expect(router.navigateToFragmentEditor.called).to.be.false;
                                expect(dialog.loading).to.be.false;
                                expect(dialog.title).to.equal('Test Baseline');
                            });

                            it('reports a failure while preparing the baseline folder', async () => {
                                sandbox.stub(fragments, 'ensureFolderExists').rejects(new Error('Forbidden'));
                                const toast = sandbox.stub(Events.toast, 'emit');

                                await dialog.handleSubmit();

                                expect(
                                    toast.calledOnceWithExactly({
                                        variant: 'negative',
                                        content: 'Failed to create baseline: Forbidden',
                                    }),
                                ).to.be.true;
                                expect(dialog.loading).to.be.false;
                            });
                        });

                        const changeTemplate = async (value) => {
                            const picker = dialog.shadowRoot.querySelector('variant-picker#template');
                            picker.value = value;
                            picker.dispatchEvent(new Event('change'));
                            await dialog.updateComplete;
                        };

                        it('clears the existing baseline error when the template changes', async () => {
                            dialog.errors = {
                                ...dialog.errors,
                                offer: 'The baseline for this product code and market segment already exists.',
                            };

                            await changeTemplate('plans');

                            expect(dialog.errors.offer).to.equal('');
                        });

                        it('keeps the missing PA code error when the template changes', async () => {
                            dialog.errors = { ...dialog.errors, offer: 'No PA code found for this offer' };

                            await changeTemplate('plans');

                            expect(dialog.errors.offer).to.equal('No PA code found for this offer');
                        });

                        it('blocks baseline creation without a template', async () => {
                            dialog.osi = 'ABC123';
                            dialog.productArrangementCode = 'PA-123';
                            const creation = stubBaselineCreation();

                            await dialog.handleSubmit();
                            await dialog.updateComplete;

                            expectNoBaselineCreated(creation);
                            expect(dialog.shadowRoot.querySelector('#template-error').textContent.trim()).to.equal(
                                'Select a template',
                            );
                        });

                        it('lists only templates available for the selected surface', async () => {
                            Store.search.set((prev) => ({ ...prev, path: 'ccd' }));
                            await dialog.updateComplete;
                            const picker = dialog.shadowRoot.querySelector('variant-picker');
                            await picker.updateComplete;

                            const values = [...picker.shadowRoot.querySelectorAll('sp-menu-item')].map((item) =>
                                item.getAttribute('value'),
                            );

                            expect(values).to.include.members(['ccd-slice', 'ccd-suggested']);
                            expect(values).to.not.include('simplified-pricing-express');
                        });

                        it('disables the template picker when no surface is selected in Studio', async () => {
                            Store.search.set((prev) => ({ ...prev, path: '' }));
                            await dialog.updateComplete;

                            expect(dialog.shadowRoot.querySelector('variant-picker').disabled).to.be.true;
                        });

                        it('resets the template on close', () => {
                            dialog.template = 'catalog';

                            dialog.close();

                            expect(dialog.template).to.equal('');
                        });

                        it('shows an offer error after the offer selector closes without a selection', async () => {
                            sandbox.stub(dialog.osiField, 'handleOpenOfferSelector');

                            dialog.openOfferSelector();
                            document.dispatchEvent(new CustomEvent('ost-close'));
                            await dialog.updateComplete;

                            expect(dialog.osiField.handleOpenOfferSelector.calledOnce).to.be.true;
                            expect(dialog.offerSelectorOpened).to.be.false;
                            expect(dialog.touched.osi).to.be.true;
                            expect(dialog.shadowRoot.querySelector('#offer-error').textContent.trim()).to.equal(
                                'Select an offer',
                            );
                        });

                        it('ignores offer selector close events when it was not opened from the dialog', async () => {
                            document.dispatchEvent(new CustomEvent('ost-close'));
                            await dialog.updateComplete;

                            expect(dialog.touched.osi).to.be.false;
                        });

                        it('stores the picked template and marks it touched', async () => {
                            const picker = dialog.shadowRoot.querySelector('variant-picker');
                            picker.value = 'catalog';

                            picker.dispatchEvent(new Event('change'));
                            await dialog.updateComplete;

                            expect(dialog.template).to.equal('catalog');
                            expect(dialog.touched.template).to.be.true;
                        });

                        it('uses the PA code carried by the selected offer without resolving it', async () => {
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: { productArrangementCode: 'PA-OFFER' } },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('PA-OFFER');
                            expect(service.resolveOfferSelectors.called).to.be.false;
                        });

                        it('takes the market segment from the WCS lookup that resolves the PA code', async () => {
                            service.resolveOfferSelectors.returns([
                                Promise.resolve([{ productArrangementCode: 'PA-EDU', marketSegments: ['EDU'] }]),
                            ]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: { market_segments: ['COM'] } },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('PA-EDU');
                            expect(dialog.marketSegment).to.equal('EDU');
                        });

                        it('shows a missing PA code error when the lookup returns no offers', async () => {
                            service.resolveOfferSelectors.returns([Promise.resolve(undefined)]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', {
                                    detail: { offerSelectorId: 'ABC123', offer: {} },
                                }),
                            );
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('');
                            expect(dialog.errors.offer).to.not.equal('');
                        });

                        it('ignores a PA code lookup superseded by a newer offer selection', async () => {
                            let resolveFirst;
                            service.resolveOfferSelectors
                                .onFirstCall()
                                .returns([new Promise((resolve) => (resolveFirst = resolve))]);
                            service.resolveOfferSelectors
                                .onSecondCall()
                                .returns([Promise.resolve([{ productArrangementCode: 'PA-2' }])]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'FIRST', offer: {} } }),
                            );
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'SECOND', offer: {} } }),
                            );
                            await delay();
                            resolveFirst([{ productArrangementCode: 'PA-1' }]);
                            await delay();

                            expect(dialog.osi).to.equal('SECOND');
                            expect(dialog.productArrangementCode).to.equal('PA-2');
                        });

                        it('does not report a failed PA code lookup superseded by a newer offer selection', async () => {
                            const toast = sandbox.stub(Events.toast, 'emit');
                            let rejectFirst;
                            service.resolveOfferSelectors
                                .onFirstCall()
                                .returns([new Promise((resolve, reject) => (rejectFirst = reject))]);
                            service.resolveOfferSelectors
                                .onSecondCall()
                                .returns([Promise.resolve([{ productArrangementCode: 'PA-2' }])]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'FIRST', offer: {} } }),
                            );
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'SECOND', offer: {} } }),
                            );
                            await delay();
                            rejectFirst(new Error('Lookup failed'));
                            await delay();

                            expect(toast.called).to.be.false;
                            expect(dialog.productArrangementCode).to.equal('PA-2');
                        });

                        it('ignores a failed PA code lookup superseded by reselecting the same offer', async () => {
                            let rejectFirst;
                            service.resolveOfferSelectors
                                .onFirstCall()
                                .returns([new Promise((resolve, reject) => (rejectFirst = reject))]);
                            service.resolveOfferSelectors
                                .onSecondCall()
                                .returns([Promise.resolve([{ productArrangementCode: 'PA-1' }])]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'SAME', offer: {} } }),
                            );
                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'SAME', offer: {} } }),
                            );
                            await delay();
                            rejectFirst(new Error('Lookup failed'));
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('PA-1');
                            expect(dialog.errors.offer).to.equal('');
                        });

                        it('ignores a PA code lookup that resolves after the form was reset', async () => {
                            let resolveFirst;
                            service.resolveOfferSelectors.returns([new Promise((resolve) => (resolveFirst = resolve))]);

                            document.dispatchEvent(
                                new CustomEvent('ost-offer-select', { detail: { offerSelectorId: 'FIRST', offer: {} } }),
                            );
                            await delay();
                            dialog.close();
                            resolveFirst([{ productArrangementCode: 'PA-1' }]);
                            await delay();

                            expect(dialog.productArrangementCode).to.equal('');
                        });

                        it('asks for a title once the title field was touched and left empty', async () => {
                            dialog.title = '';
                            dialog.touched = { ...dialog.touched, title: true };
                            await dialog.updateComplete;

                            expect(dialog.shadowRoot.querySelector('#title-error').textContent.trim()).to.equal(
                                'Enter a title',
                            );
                        });

                        it('stops listening for offer selector close when removed', () => {
                            const removeListener = sandbox.spy(document, 'removeEventListener');
                            const element = document.createElement('mas-create-dialog');
                            document.body.append(element);

                            element.remove();

                            expect(removeListener.calledWith('ost-close')).to.be.true;
                        });
                    });

                    it('should make a POST fetch request when form is submitted', async () => {
                        Store.search.set({ path: 'sandbox' });
                        Store.filters.set({ locale: 'en_US' });

                        document.dispatchEvent(
                            new CustomEvent('ost-offer-select', {
                                detail: { offerSelectorId: 'ABC123', offer: {} },
                            }),
                        );

                        // Fill in the form
                        const titleField = dialog.shadowRoot.querySelector('#fragment-title');

                        // Set title
                        titleField.value = 'Test Merch Card';
                        titleField.dispatchEvent(new Event('input', { bubbles: true }));

                        await dialog.updateComplete;

                        // Submit the form by clicking the Create button
                        const createButton = dialog.shadowRoot.querySelector('sp-button[variant="accent"]');
                        createButton.click();
                        await dialog.updateComplete;

                        // Verify fetch was called with correct parameters
                        expect(fetchStub.called).to.be.true;
                        const fetchCall = fetchStub.getCall(0);
                        expect(fetchCall.args[0]).to.include('/test/mocks/adobe/sites/cf/fragments');

                        // Verify it was a POST request with correct data
                        const options = fetchCall.args[1];
                        expect(options.method).to.equal('POST');

                        // Parse the request body
                        const requestBody = JSON.parse(options.body);
                        expect(requestBody).to.have.property('title', 'Test Merch Card');
                        expect(requestBody).to.have.property('modelId');
                    });

                    it('should display the correct dialog title based on type', async () => {
                        // Reset dialog state from previous tests
                        dialog.loading = false;

                        // Test with merch-card type
                        dialog.type = 'merch-card';
                        await dialog.updateComplete;

                        let heading = dialog.shadowRoot.querySelector('.dialog-header');
                        expect(heading).to.exist;
                        expect(heading.textContent.trim()).to.equal('Create New Merch Card');

                        // Test with merch-card-collection type
                        dialog.type = 'merch-card-collection';
                        await dialog.updateComplete;

                        heading = dialog.shadowRoot.querySelector('.dialog-header');
                        expect(heading).to.exist;
                        expect(heading.textContent.trim()).to.equal('Create New Merch Card Collection');

                        dialog.type = 'compare-chart';
                        await dialog.updateComplete;

                        heading = dialog.shadowRoot.querySelector('.dialog-header');
                        expect(heading).to.exist;
                        expect(heading.textContent.trim()).to.equal('Create New Compare Chart');
                    });

                    it('should create compare chart as a collection with compareChart HTML', async () => {
                        Store.search.set({ path: 'sandbox' });
                        Store.filters.set({ locale: 'en_US' });
                        dialog.loading = false;
                        dialog.type = 'compare-chart';
                        await dialog.updateComplete;

                        const titleField = dialog.shadowRoot.querySelector('#fragment-title');
                        titleField.value = 'Test Compare Chart';
                        titleField.dispatchEvent(new Event('input', { bubbles: true }));

                        const createButton = dialog.shadowRoot.querySelector('sp-button[variant="accent"]');
                        createButton.click();
                        await dialog.updateComplete;

                        expect(fetchStub.called).to.be.true;
                        const options = fetchStub.getCall(0).args[1];
                        const requestBody = JSON.parse(options.body);
                        const compareChartField = requestBody.fields.find((field) => field.name === 'compareChart');
                        const labelField = requestBody.fields.find((field) => field.name === 'label');
                        const tagsField = requestBody.fields.find((field) => field.name === 'tags');

                        expect(requestBody).to.have.property('title', 'Test Compare Chart');
                        expect(labelField).to.exist;
                        expect(labelField.values).to.deep.equal(['Test Compare Chart']);
                        expect(compareChartField).to.exist;
                        expect(compareChartField.type).to.equal('long-text');
                        expect(compareChartField.values[0]).to.include('<mas-compare-chart>');
                        expect(tagsField).to.not.exist;
                    });

                    it('should not retry compare chart creation after a non-conflict failure', async () => {
                        Store.search.set({ path: 'sandbox' });
                        Store.filters.set({ locale: 'en_US' });
                        dialog.loading = false;
                        dialog.type = 'compare-chart';
                        await dialog.updateComplete;

                        fetchStub.restore();
                        fetchStub = stub(window, 'fetch').resolves({
                            ok: false,
                            status: 400,
                            statusText: 'Bad Request',
                            headers: { get() {} },
                            json: () => Promise.resolve({}),
                        });

                        const titleField = dialog.shadowRoot.querySelector('#fragment-title');
                        titleField.value = 'Invalid Compare Chart';
                        titleField.dispatchEvent(new Event('input', { bubbles: true }));

                        const createButton = dialog.shadowRoot.querySelector('sp-button[variant="accent"]');
                        createButton.click();
                        await delay();

                        expect(fetchStub.callCount).to.equal(1);
                        expect(dialog.loading).to.be.false;
                    });
                });
            });
        </script>
        <main>
            <mas-repository bucket="test" base-url="/test/mocks"></mas-repository>
            <sp-theme system="spectrum-two" color="light" scale="medium">
                <mas-create-dialog open></mas-create-dialog>
            </sp-theme>
        </main>
    </body>
