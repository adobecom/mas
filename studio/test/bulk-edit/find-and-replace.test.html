<!doctype html>
<html>
    <head>
        <title>Find and replace UI preview</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <script src="../../src/swc.js" type="module"></script>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
            h2 {
                margin: 24px 32px;
            }
        </style>
    </head>
    <body>
        <sp-theme system="spectrum-two" color="light" scale="medium">
            <h2>Project list with actions and Create project</h2>
            <mas-bulk-edit id="projects"></mas-bulk-edit>
            <h2>New project: design controls and empty fragments table</h2>
            <mas-bulk-edit-editor id="editor"></mas-bulk-edit-editor>
        </sp-theme>
        <script type="module">
            import { expect } from '@esm-bundle/chai';
            import { waitUntil } from '@open-wc/testing';
            import '@adobecom/mas';
            import Store from '../../src/store.js';
            import { Fragment } from '../../src/aem/fragment.js';
            import { FragmentStore } from '../../src/reactivity/fragment-store.js';
            import '../../src/bulk-edit/mas-bulk-edit.js';
            import '../../src/bulk-edit/mas-bulk-edit-editor.js';

            Store.bulkEditProjects.projectId.set(null);
            Store.bulkEditProjects.list.loading.set(false);
            Store.bulkEditProjects.list.data.set([
                new FragmentStore(
                    new Fragment({
                        id: 'preview-project',
                        path: '/content/dam/mas/bulk-edit-projects/sandbox/preview',
                        fields: [
                            { name: 'title', values: ['Replace school with university-MWPW-191345'] },
                            { name: 'status', values: ['Draft'] },
                        ],
                        created: { fullName: 'Example author', at: '2026-11-02T16:00:00Z' },
                    }),
                ),
            ]);

            if (window.__WTR_CONFIG__) {
                const { runTests } = await import('@web/test-runner-mocha');
                runTests(() => {
                    describe('Find and replace visual UI', () => {
                        it('shows a populated project list with the blue Create project button', async () => {
                            const projects = document.querySelector('#projects');
                            await projects.updateComplete;
                            expect(projects.shadowRoot.querySelectorAll('[data-testid="project-row"]')).to.have.lengthOf(1);
                            expect(projects.shadowRoot.querySelector('[data-testid="create-btn"]').variant).to.equal('accent');
                        });

                        it('matches Bulk publish padding and insets the heading, toolbar and table by 32px', async () => {
                            await import('../../src/bulk-publish/mas-bulk-publish.js');
                            const publish = document.createElement('mas-bulk-publish');
                            document.body.append(publish);
                            await publish.updateComplete;
                            const projects = document.querySelector('#projects');
                            await projects.updateComplete;
                            const root = projects.shadowRoot;
                            const container = root.querySelector('.page-container');
                            const reference = publish.shadowRoot.querySelector('.page-container');
                            expect(getComputedStyle(container).padding).to.equal(getComputedStyle(reference).padding);
                            expect(getComputedStyle(container).padding).to.equal('32px');
                            await waitUntil(() => root.querySelector('.item-table').getBoundingClientRect().width > 0);
                            const hostBounds = projects.getBoundingClientRect();
                            for (const selector of ['h1', 'sp-tabs', '[data-testid="project-search"]', '.item-table']) {
                                expect(root.querySelector(selector).getBoundingClientRect().left - hostBounds.left).to.equal(
                                    32,
                                );
                            }
                            expect(root.querySelector('h1').getBoundingClientRect().top - hostBounds.top).to.equal(32);
                            expect(
                                hostBounds.right -
                                    root.querySelector('[data-testid="create-btn"]').getBoundingClientRect().right,
                            ).to.equal(32);
                            publish.remove();
                        });

                        it('keeps Find and replace selected when the unimplemented Update offer tab is clicked', async () => {
                            const projects = document.querySelector('#projects');
                            await projects.updateComplete;
                            const tabs = projects.shadowRoot.querySelector('sp-tabs');
                            await tabs.updateComplete;
                            const updateOffer = tabs.querySelector('sp-tab[value="update-offer"]');
                            expect(updateOffer.disabled).to.be.true;
                            updateOffer.click();
                            await tabs.updateComplete;
                            expect(tabs.selected).to.equal('find-and-replace');
                            expect(tabs.querySelector('sp-tab-panel[value="find-and-replace"]').selected).to.be.true;
                            expect(projects.shadowRoot.querySelector('[data-testid="project-row"]')).to.exist;
                        });

                        it('places search and its result count to the left of Create project and filters the list', async () => {
                            const projects = document.querySelector('#projects');
                            await projects.updateComplete;
                            const root = projects.shadowRoot;
                            const search = root.querySelector('[data-testid="project-search"]');
                            const count = root.querySelector('[data-testid="result-count"]');
                            const create = root.querySelector('[data-testid="create-btn"]');
                            await waitUntil(() => count.getBoundingClientRect().width > 0);
                            expect(search.getBoundingClientRect().right).to.be.at.most(count.getBoundingClientRect().left);
                            expect(count.getBoundingClientRect().right).to.be.at.most(create.getBoundingClientRect().left);
                            expect(search.getBoundingClientRect().top).to.be.closeTo(create.getBoundingClientRect().top, 5);
                            search.value = 'missing project';
                            search.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
                            await projects.updateComplete;
                            expect(root.querySelector('[data-testid="no-results"]')).to.exist;
                            search.value = '';
                            search.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
                            await projects.updateComplete;
                            expect(root.querySelector('[data-testid="project-row"]')).to.exist;
                        });

                        it('uses the full editor width with 32px side padding on a 1400px page', async () => {
                            const viewport = document.createElement('div');
                            viewport.style.width = '1400px';
                            const editor = document.createElement('mas-bulk-edit-editor');
                            viewport.append(editor);
                            document.body.append(viewport);
                            await editor.updateComplete;
                            const bounds = viewport.getBoundingClientRect();
                            expect(editor.getBoundingClientRect().width).to.equal(1400);
                            expect(getComputedStyle(editor).maxWidth).to.equal('none');
                            for (const selector of ['header', '.card', '.fragments-table']) {
                                const elementBounds = editor.shadowRoot.querySelector(selector).getBoundingClientRect();
                                expect(elementBounds.left - bounds.left).to.equal(32);
                                expect(bounds.right - elementBounds.right).to.equal(32);
                            }
                            viewport.remove();
                        });

                        it('shows the empty editor with the design controls and no results', async () => {
                            const editor = document.querySelector('#editor');
                            await editor.updateComplete;
                            expect(editor.shadowRoot.querySelector('#find-text')).to.exist;
                            expect(editor.shadowRoot.querySelector('#replace-text')).to.exist;
                            expect(editor.shadowRoot.querySelector('#search-in')).to.exist;
                            expect(editor.shadowRoot.querySelectorAll('sp-table-row')).to.have.lengthOf(0);
                            expect(
                                [...editor.shadowRoot.querySelectorAll('.file-actions sp-button')].every(
                                    (button) => button.disabled,
                                ),
                            ).to.be.true;
                            expect(editor.shadowRoot.querySelector('sp-illustrated-message h2').textContent).to.equal(
                                'No search queries entered yet',
                            );
                        });
                    });
                });
            }
        </script>
    </body>
</html>
