<html>
    <head>
        <script>
            window.__swc = { warn: () => {} };
        </script>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };

        <title>merch-card-collection-editor test page</title>
        <meta name="nofollow-links" content="on" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../../style.css" />

                max-width: 1000px;
            }

            sp-theme {
                display: contents;
            }
        </style>
    </head>
    <body>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { spy, stub } from 'sinon';
            import { initElementFromTemplate } from '../utils.js';

            import '../../src/swc.js';
            import '../../src/editors/merch-card-collection-editor.js';
            import { Fragment } from '../../src/aem/fragment.js';
            import { FragmentStore } from '../../src/reactivity/fragment-store.js';
            import { CARD_MODEL_PATH, COLLECTION_MODEL_PATH, PAGE_NAMES, QUICK_ACTION, STAGED } from '../../src/constants.js';
            import Store from '../../src/store.js';
            import router from '../../src/router.js';

            runTests(async () => {
                describe('merch-card-collection-editor custom element', async () => {
                    beforeEach(async () => {
                        const editorPanel = initElementFromTemplate('merch-card-collection-editor');
                    });
                    it('should render', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const collectionFragment = await fetch('/test/mocks/adobe/sites/cf/fragments/collection.json').then(
                            (res) => res.json(),
                        );
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionFragment));
                        document.querySelector('main sp-theme').appendChild(editor);
                        await editor.updateComplete;
                        expect(editor).to.exist;
                        editor.remove();
                    });
                    it('should mark collection staged', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const collectionFragment = await fetch('/test/mocks/adobe/sites/cf/fragments/collection.json').then(
                            (res) => res.json(),
                        );
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionFragment));
                        document.querySelector('main sp-theme').appendChild(editor);
                        await editor.updateComplete;
                        expect(editor).to.exist;

                        editor.shadowRoot
                            .querySelector('sp-switch#markStaged')
                            .dispatchEvent(new Event('change', { bubbles: true, composed: true }));

                        const tags = editor.fragmentStore.get().fields.find((field) => field.name === 'tags')?.values[0];
                        expect(tags).to.equal(STAGED.TAG);

                        editor.remove();
                    });
                    it('should display collection status', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const collectionFragment = await fetch('/test/mocks/adobe/sites/cf/fragments/collection.json').then(
                            (res) => res.json(),
                        );
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionFragment));
                        document.querySelector('main sp-theme').appendChild(editor);
                        await editor.updateComplete;
                        expect(editor).to.exist;

                        const statusEl = editor.shadowRoot.querySelector(
                            '.editor-container .section-staged-status mas-fragment-status',
                        );
                        expect(statusEl.getAttribute('variant')).to.equal('draft');
                    });
                });

                describe('grouped variation tags', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let groupedTestHost;

                    beforeEach(() => {
                        groupedTestHost = document.createElement('div');
                        groupedTestHost.id = 'grouped-collection-editor-tests';
                        spTheme().appendChild(groupedTestHost);
                    });

                    afterEach(() => {
                        groupedTestHost?.remove();
                        groupedTestHost = null;
                        Store.showCloneDialog.set(false);
                    });

                    function groupedCollectionFragmentData(overrides = {}) {
                        return {
                            id: 'grouped-collection-id',
                            path: '/content/mas/collections/en_US/all/pzn/grouped-collection',
                            model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                            title: 'Grouped collection',
                            tags: [],
                            fields: [
                                { name: 'label', type: 'text', multiple: false, values: ['Label'] },
                                { name: 'queryLabel', type: 'text', multiple: false, values: [''] },
                                { name: 'icon', type: 'text', multiple: false, values: [''] },
                                { name: 'iconLight', type: 'text', multiple: false, values: [''] },
                                { name: 'cards', type: 'content-reference', multiple: true, values: [] },
                                { name: 'collections', type: 'content-reference', multiple: true, values: [] },
                                {
                                    name: 'pznTags',
                                    type: 'text',
                                    multiple: true,
                                    values: ['mas:locale/fr_FR', 'mas:locale/de_DE'],
                                },
                            ],
                            references: [],
                            ...overrides,
                        };
                    }

                    it('should render grouped variation tag picker in sidenav when path is a grouped variation', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const fragmentStore = new FragmentStore(new Fragment(groupedCollectionFragmentData()));
                        editor.fragmentStore = fragmentStore;
                        groupedTestHost.appendChild(editor);
                        await editor.updateComplete;

                        const groupedGroup = editor.shadowRoot.querySelector('#grouped-variation-tags');
                        expect(groupedGroup).to.exist;
                        const picker = groupedGroup.querySelector('aem-tag-picker-field');
                        expect(picker).to.exist;
                        expect(picker.getAttribute('value')).to.equal('mas:locale/fr_FR,mas:locale/de_DE');
                    });

                    it('should not render grouped variation tag picker when path is not grouped', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const data = groupedCollectionFragmentData({
                            path: '/content/mas/collections/en_US/all',
                        });
                        const fragmentStore = new FragmentStore(new Fragment(data));
                        editor.fragmentStore = fragmentStore;
                        groupedTestHost.appendChild(editor);
                        await editor.updateComplete;

                        expect(editor.shadowRoot.querySelector('#grouped-variation-tags')).to.not.exist;
                    });

                    it('should update pznTags on tag picker change', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const fragmentStore = new FragmentStore(new Fragment(groupedCollectionFragmentData()));
                        const updateSpy = spy(fragmentStore, 'updateField');
                        editor.fragmentStore = fragmentStore;
                        groupedTestHost.appendChild(editor);
                        await editor.updateComplete;

                        const picker = editor.shadowRoot.querySelector('#grouped-variation-tags aem-tag-picker-field');
                        picker.setAttribute('value', 'mas:locale/en_GB,mas:locale/en_IE');
                        picker.dispatchEvent(new Event('change', { bubbles: true, composed: true }));

                        expect(updateSpy.calledWith('pznTags', ['mas:locale/en_GB', 'mas:locale/en_IE'])).to.be.true;
                        updateSpy.restore();
                    });
                });

                describe('studio paste links', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let pasteHost;
                    let qsStub;

                    function collectionForPaste(overrides = {}) {
                        return {
                            id: 'paste-test-collection',
                            path: '/content/mas/collections/en_US/paste-test',
                            model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                            title: 'Paste test',
                            tags: [],
                            fields: [
                                { name: 'label', type: 'text', multiple: false, values: ['L'] },
                                { name: 'queryLabel', type: 'text', multiple: false, values: [''] },
                                { name: 'icon', type: 'text', multiple: false, values: [''] },
                                { name: 'iconLight', type: 'text', multiple: false, values: [''] },
                                { name: 'cards', type: 'content-reference', multiple: true, values: [] },
                                { name: 'collections', type: 'content-reference', multiple: true, values: [] },
                            ],
                            references: [],
                            ...overrides,
                        };
                    }

                    beforeEach(() => {
                        pasteHost = document.createElement('div');
                        pasteHost.id = 'collection-paste-tests';
                        spTheme().appendChild(pasteHost);
                    });

                    afterEach(() => {
                        qsStub?.restore();
                        qsStub = undefined;
                        pasteHost?.remove();
                        pasteHost = null;
                    });

                    it('renders paste area with textarea and hides URL list until paste', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionForPaste()));
                        pasteHost.appendChild(editor);
                        await editor.updateComplete;

                        expect(editor.shadowRoot.querySelector('.collection-paste-links')).to.exist;
                        expect(editor.shadowRoot.querySelector('#collection-paste-links')).to.exist;
                        expect(editor.shadowRoot.querySelector('.collection-paste-url-panel')).to.not.exist;
                    });

                    it('merges pasted lines into the URL list and dedupes', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionForPaste()));
                        pasteHost.appendChild(editor);
                        await editor.updateComplete;

                        const tf = editor.shadowRoot.querySelector('#collection-paste-links');
                        const line =
                            'https://mas.adobe.com/studio.html#content-type=merch-card&page=content&path=sandbox&query=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
                        const dt = new DataTransfer();
                        dt.setData(
                            'text/plain',
                            `${line}\n${line}\nhttps://mas.adobe.com/studio.html#content-type=merch-card-collection&page=content&path=sandbox&query=bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb`,
                        );
                        tf.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, composed: true, clipboardData: dt }));
                        await editor.updateComplete;

                        const rows = editor.shadowRoot.querySelectorAll('.collection-paste-url-row');
                        expect(rows.length).to.equal(2);
                    });

                    it('does not remove URL list rows when the textarea is cleared', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionForPaste()));
                        pasteHost.appendChild(editor);
                        await editor.updateComplete;

                        const tf = editor.shadowRoot.querySelector('#collection-paste-links');
                        const dt = new DataTransfer();
                        dt.setData(
                            'text/plain',
                            'https://mas.adobe.com/studio.html#content-type=merch-card&page=content&path=sandbox&query=cccccccc-cccc-4ccc-8ccc-cccccccccccc',
                        );
                        tf.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, composed: true, clipboardData: dt }));
                        await editor.updateComplete;
                        expect(editor.shadowRoot.querySelectorAll('.collection-paste-url-row').length).to.equal(1);

                        editor.collectionPasteLinksInput = '';
                        await editor.updateComplete;
                        expect(editor.shadowRoot.querySelectorAll('.collection-paste-url-row').length).to.equal(1);
                    });

                    it('removes a URL row when delete is clicked', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionForPaste()));
                        pasteHost.appendChild(editor);
                        await editor.updateComplete;

                        const tf = editor.shadowRoot.querySelector('#collection-paste-links');
                        const dt = new DataTransfer();
                        dt.setData(
                            'text/plain',
                            'https://mas.adobe.com/studio.html#content-type=merch-card&page=content&path=sandbox&query=dddddddd-dddd-4ddd-8ddd-dddddddddddd\nhttps://mas.adobe.com/studio.html#content-type=merch-card&page=content&path=sandbox&query=eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
                        );
                        tf.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, composed: true, clipboardData: dt }));
                        await editor.updateComplete;

                        const firstDelete = editor.shadowRoot.querySelector('.collection-paste-url-row sp-action-button');
                        firstDelete.click();
                        await editor.updateComplete;
                        expect(editor.shadowRoot.querySelectorAll('.collection-paste-url-row').length).to.equal(1);
                    });

                    it('Add from links uses pasted list and calls updateFragment when repository is available', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        const updateSpy = spy();
                        editor.updateFragment = updateSpy;
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionForPaste()));
                        pasteHost.appendChild(editor);
                        await editor.updateComplete;

                        const mockRepo = {
                            aem: {
                                sites: {
                                    cf: {
                                        fragments: {
                                            getById: async () => ({
                                                id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                                                path: '/content/mas/cards/from-paste-test',
                                                model: { path: CARD_MODEL_PATH },
                                                fields: [],
                                            }),
                                        },
                                    },
                                },
                            },
                        };
                        const origQs = Document.prototype.querySelector;
                        qsStub = stub(document, 'querySelector').callsFake((sel) =>
                            sel === 'mas-repository' ? mockRepo : origQs.call(document, sel),
                        );

                        const tf = editor.shadowRoot.querySelector('#collection-paste-links');
                        const dt = new DataTransfer();
                        dt.setData(
                            'text/plain',
                            'https://mas.adobe.com/studio.html#content-type=merch-card&page=content&path=sandbox&query=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                        );
                        tf.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, composed: true, clipboardData: dt }));
                        await editor.updateComplete;

                        const addBtn = editor.shadowRoot.querySelector('.collection-paste-links sp-button');
                        addBtn.click();
                        await editor.updateComplete;

                        expect(updateSpy.called).to.be.true;
                        const fieldCalls = updateSpy.getCalls().filter((c) => c.args[0]?.target?.dataset?.field === 'cards');
                        expect(fieldCalls.length).to.be.at.least(1);
                        expect(editor.collectionPasteLinksItems.length).to.equal(0);
                    });
                });

                describe('fragment editor section', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let fragEditorHost;

                    function collectionWithLocReady(locReadyValue = false, suffix = '') {
                        return {
                            id: `frag-editor${suffix}`,
                            path: `/content/mas/collections/en_US/all/frag-editor${suffix}`,
                            model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                            title: 'Fragment Editor Test',
                            description: 'Test description text',
                            tags: [],
                            fields: [
                                { name: 'label', type: 'text', multiple: false, values: ['L'] },
                                { name: 'queryLabel', type: 'text', multiple: false, values: [''] },
                                { name: 'icon', type: 'text', multiple: false, values: [''] },
                                { name: 'iconLight', type: 'text', multiple: false, values: [''] },
                                { name: 'cards', type: 'content-reference', multiple: true, values: [] },
                                { name: 'collections', type: 'content-reference', multiple: true, values: [] },
                                { name: 'locReady', type: 'boolean', multiple: false, values: [locReadyValue] },
                            ],
                            references: [],
                        };
                    }

                    beforeEach(() => {
                        fragEditorHost = document.createElement('div');
                        spTheme().appendChild(fragEditorHost);
                    });

                    afterEach(() => {
                        fragEditorHost?.remove();
                        fragEditorHost = null;
                    });

                    it('renders fragment-title, collection-description, and the locReady sp-switch', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionWithLocReady(false, '-render')));
                        fragEditorHost.appendChild(editor);
                        await editor.updateComplete;

                        expect(editor.shadowRoot.querySelector('#fragment-title')).to.exist;
                        expect(editor.shadowRoot.querySelector('#collection-description')).to.exist;
                        expect(editor.shadowRoot.querySelector('sp-switch:not(#hide-cards)')).to.exist;
                    });

                    it('calls fragmentStore.updateField to toggle locReady when the sp-switch fires a change event', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const fragmentStore = new FragmentStore(new Fragment(collectionWithLocReady(false, '-toggle')));
                        const updateFieldSpy = spy(fragmentStore, 'updateField');
                        editor.fragmentStore = fragmentStore;
                        fragEditorHost.appendChild(editor);
                        await editor.updateComplete;

                        editor.shadowRoot
                            .querySelector('sp-switch:not(#hide-cards):not(#markStaged)')
                            .dispatchEvent(new Event('change', { bubbles: true, composed: true }));

                        const locReadyCall = updateFieldSpy.getCalls().find((c) => c.args[0] === 'locReady');
                        expect(locReadyCall).to.exist;
                        expect(locReadyCall.args[1]).to.deep.equal([true]); // !false → true
                        updateFieldSpy.restore();
                    });

                    it('calls fragmentStore.updateFieldInternal with field name and new value on title input', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        const fragmentStore = new FragmentStore(new Fragment(collectionWithLocReady(false, '-internal')));
                        const updateInternalSpy = spy(fragmentStore, 'updateFieldInternal');
                        editor.fragmentStore = fragmentStore;
                        fragEditorHost.appendChild(editor);
                        await editor.updateComplete;

                        const titleField = editor.shadowRoot.querySelector('#fragment-title');
                        titleField.value = 'Updated Title';
                        titleField.dispatchEvent(new Event('input', { bubbles: true, composed: true }));

                        expect(updateInternalSpy.calledWith('title', 'Updated Title')).to.be.true;
                        updateInternalSpy.restore();
                    });
                });

                describe('promo variation collection editing', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let promoHost;

                    const cardA = {
                        id: 'card-a-id',
                        path: '/content/dam/mas/sandbox/en_US/promotions/black-friday/card-a',
                        title: 'Card A',
                        model: { path: CARD_MODEL_PATH },
                        fields: [],
                        tags: [],
                    };
                    const cardB = {
                        id: 'card-b-id',
                        path: '/content/dam/mas/sandbox/en_US/promotions/black-friday/card-b',
                        title: 'Card B',
                        model: { path: CARD_MODEL_PATH },
                        fields: [],
                        tags: [],
                    };

                    function promoVariationCollectionData(overrides = {}) {
                        return {
                            id: 'promo-variation-collection-id',
                            path: '/content/dam/mas/sandbox/en_US/promotions/black-friday/my-collection',
                            model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                            title: 'Promo Collection Variation',
                            tags: [{ id: 'mas:promotion/black-friday' }],
                            fields: [
                                { name: 'label', type: 'text', multiple: false, values: ['Label'] },
                                { name: 'queryLabel', type: 'text', multiple: false, values: [''] },
                                { name: 'icon', type: 'text', multiple: false, values: [''] },
                                { name: 'iconLight', type: 'text', multiple: false, values: [''] },
                                { name: 'cards', type: 'content-reference', multiple: true, values: [cardA.path, cardB.path] },
                                { name: 'collections', type: 'content-reference', multiple: true, values: [] },
                            ],
                            references: [cardA, cardB],
                            ...overrides,
                        };
                    }

                    beforeEach(() => {
                        promoHost = document.createElement('div');
                        spTheme().appendChild(promoHost);
                    });

                    afterEach(() => {
                        promoHost?.remove();
                        promoHost = null;
                    });

                    // A promo variation is a full clone (own `cards` field already has real values), but
                    // editorContextStore.isVariation() reports promo variations as `isVariation: true` just
                    // like locale variations. getEffectiveFieldValues only reads the parent when the
                    // variation's own values are empty, so this pins the non-empty case: the variation's
                    // own cards must render, not the parent's, even with isVariation true.
                    it("renders a promo variation collection's own cards, not the locale-default parent's, even though isVariation is true", async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.isVariation = true;
                        const parentOnlyCardPath = '/content/dam/mas/sandbox/en_US/parent-only-card';
                        editor.localeDefaultFragment = new Fragment({
                            id: 'default-collection-id',
                            path: '/content/dam/mas/sandbox/en_US/my-collection',
                            model: { path: COLLECTION_MODEL_PATH },
                            fields: [
                                { name: 'cards', type: 'content-reference', multiple: true, values: [parentOnlyCardPath] },
                            ],
                            references: [
                                {
                                    id: 'parent-only-card-id',
                                    path: parentOnlyCardPath,
                                    title: 'Parent-only card',
                                    model: { path: CARD_MODEL_PATH },
                                    fields: [],
                                },
                            ],
                        });
                        editor.fragmentStore = new FragmentStore(new Fragment(promoVariationCollectionData()));
                        promoHost.appendChild(editor);
                        await editor.updateComplete;
                        await editor.updateComplete;

                        const subtexts = Array.from(editor.shadowRoot.querySelectorAll('.item-subtext')).map((el) =>
                            el.textContent.trim(),
                        );
                        expect(subtexts).to.deep.equal(['Card A', 'Card B']);
                    });

                    it('removeItem on a promo variation collection updates only its own cards field', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        const updateSpy = spy();
                        editor.updateFragment = updateSpy;
                        editor.isVariation = true;
                        editor.fragmentStore = new FragmentStore(new Fragment(promoVariationCollectionData()));
                        promoHost.appendChild(editor);
                        await editor.updateComplete;
                        await editor.updateComplete;

                        editor.removeItem(cardA.path);
                        await editor.updateComplete;

                        expect(updateSpy.called).to.be.true;
                        const cardsCall = updateSpy.getCalls().find((c) => c.args[0]?.target?.dataset?.field === 'cards');
                        expect(cardsCall).to.exist;
                        expect(cardsCall.args[0].values).to.deep.equal([cardB.path]);
                    });

                    it('reorders cards on a promo variation collection via internal drag-and-drop', async () => {
                        const editor = document.createElement('merch-card-collection-editor');
                        const updateSpy = spy();
                        editor.updateFragment = updateSpy;
                        editor.isVariation = true;
                        editor.fragmentStore = new FragmentStore(new Fragment(promoVariationCollectionData()));
                        promoHost.appendChild(editor);
                        await editor.updateComplete;
                        await editor.updateComplete;

                        // Mirrors what #dragStart puts on the DataTransfer for item 0 (card-a), then
                        // drives the same public entry point the real @drop listener calls (#drop is
                        // private, but it just forwards to this).
                        editor.draggingIndex = 0;
                        editor.draggingFieldName = 'cards';
                        const dragData = {
                            isInternalDrag: true,
                            sourceIndex: 0,
                            fieldName: 'cards',
                            id: cardA.id,
                            path: cardA.path,
                            model: cardA.model,
                            title: cardA.title,
                        };
                        const dropEvent = {
                            preventDefault: () => {},
                            stopPropagation: () => {},
                            dataTransfer: { getData: () => JSON.stringify(dragData) },
                        };
                        editor.handleDropOperation(dropEvent, 'cards', 1, true);
                        await editor.updateComplete;

                        expect(updateSpy.called).to.be.true;
                        const cardsCall = updateSpy.getCalls().find((c) => c.args[0]?.target?.dataset?.field === 'cards');
                        expect(cardsCall).to.exist;
                        expect(cardsCall.args[0].values).to.deep.equal([cardB.path, cardA.path]);
                    });
                });

                describe('quick actions bar', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let quickActionsHost;
                    let hostEditor;
                    let querySelectorStub;

                    const collectionData = {
                        id: 'qa-collection-id',
                        path: '/content/dam/mas/sandbox/en_US/qa-collection',
                        model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                        title: 'QA Collection',
                        tags: [],
                        fields: [{ name: 'label', type: 'text', multiple: false, values: ['Label'] }],
                    };

                    async function mountEditor({ isVariation = false } = {}) {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.isVariation = isVariation;
                        editor.fragmentStore = new FragmentStore(new Fragment(collectionData));
                        quickActionsHost.appendChild(editor);
                        await editor.updateComplete;
                        return editor;
                    }

                    const quickActionsOf = (editor) => editor.shadowRoot.querySelector('mas-quick-actions');
                    const trigger = (editor, action) =>
                        quickActionsOf(editor).dispatchEvent(new CustomEvent(action, { bubbles: true, composed: true }));

                    beforeEach(() => {
                        quickActionsHost = document.createElement('div');
                        spTheme().appendChild(quickActionsHost);
                        hostEditor = Object.assign(new EventTarget(), {
                            promptDiscardChanges: spy(),
                            showCreateVariation: spy(),
                        });
                        querySelectorStub = stub(document, 'querySelector');
                        querySelectorStub.callThrough();
                        querySelectorStub.withArgs('mas-fragment-editor').returns(hostEditor);
                    });

                    afterEach(() => {
                        querySelectorStub.restore();
                        quickActionsHost?.remove();
                        quickActionsHost = null;
                    });

                    it('offers the same actions as the sidenav toolbar plus Discard', async () => {
                        const editor = await mountEditor();
                        expect(quickActionsOf(editor).actions).to.deep.equal([
                            QUICK_ACTION.SAVE,
                            QUICK_ACTION.DISCARD,
                            QUICK_ACTION.CREATE_VARIATION,
                            QUICK_ACTION.DUPLICATE,
                            QUICK_ACTION.PREVIEW,
                            QUICK_ACTION.PUBLISH,
                            QUICK_ACTION.COPY,
                            QUICK_ACTION.HISTORY,
                            QUICK_ACTION.DELETE,
                        ]);
                    });

                    it('hides Create Variation and Duplicate for variations', async () => {
                        const editor = await mountEditor({ isVariation: true });
                        const { actions } = quickActionsOf(editor);
                        expect(actions).to.not.include(QUICK_ACTION.CREATE_VARIATION);
                        expect(actions).to.not.include(QUICK_ACTION.DUPLICATE);
                        expect(actions).to.include(QUICK_ACTION.HISTORY);
                    });

                    it('disables Save and Discard until there are changes', async () => {
                        expect(Store.editor.hasChanges).to.be.false;
                        const editor = await mountEditor();
                        const { disabled } = quickActionsOf(editor);
                        expect(disabled.has(QUICK_ACTION.SAVE)).to.be.true;
                        expect(disabled.has(QUICK_ACTION.DISCARD)).to.be.true;
                        expect(disabled.has(QUICK_ACTION.HISTORY)).to.be.false;
                    });

                    it('delegates Discard and Create Variation to the fragment editor', async () => {
                        const editor = await mountEditor();
                        trigger(editor, QUICK_ACTION.DISCARD);
                        trigger(editor, QUICK_ACTION.CREATE_VARIATION);
                        expect(hostEditor.promptDiscardChanges.calledOnce).to.be.true;
                        expect(hostEditor.showCreateVariation.calledOnce).to.be.true;
                    });

                    it('opens the fragment preview in a new tab', async () => {
                        const openStub = stub(window, 'open');
                        try {
                            const editor = await mountEditor();
                            trigger(editor, QUICK_ACTION.PREVIEW);
                            expect(openStub.calledOnce).to.be.true;
                            expect(openStub.firstCall.args[0]).to.include('fragment-id=qa-collection-id');
                            expect(openStub.firstCall.args[0]).to.include('content-type=merch-card-collection');
                        } finally {
                            openStub.restore();
                        }
                    });

                    it('navigates to the version history of the collection', async () => {
                        const navigate = spy();
                        const navigateStub = stub(router, 'navigateToPage').returns(navigate);
                        try {
                            const editor = await mountEditor();
                            trigger(editor, QUICK_ACTION.HISTORY);
                            expect(Store.version.fragmentId.get()).to.equal('qa-collection-id');
                            expect(navigateStub.calledOnceWith(PAGE_NAMES.VERSION)).to.be.true;
                            expect(navigate.calledOnce).to.be.true;
                        } finally {
                            navigateStub.restore();
                            Store.version.fragmentId.set(null);
                        }
                    });
                });

                describe('reopened collection with saved cards and categories', () => {
                    const spTheme = () => document.querySelector('main sp-theme');
                    let reopenHost;

                    const savedCard = {
                        id: 'saved-card-id',
                        path: '/content/dam/mas/sandbox/en_US/saved-card',
                        title: 'Saved Card',
                        model: { path: CARD_MODEL_PATH },
                        fields: [],
                        tags: [],
                    };
                    const savedCategory = {
                        id: 'saved-category-id',
                        path: '/content/dam/mas/sandbox/en_US/saved-category',
                        title: 'Saved Category',
                        model: { path: COLLECTION_MODEL_PATH },
                        fields: [],
                        tags: [],
                    };

                    function savedCollectionData(overrides = {}) {
                        return {
                            id: 'saved-collection-id',
                            path: '/content/dam/mas/sandbox/en_US/saved-collection',
                            model: { path: COLLECTION_MODEL_PATH, name: 'Collection', title: 'Collection' },
                            title: 'Saved Collection',
                            tags: [],
                            fields: [
                                { name: 'label', type: 'text', multiple: false, values: ['Label'] },
                                { name: 'cards', type: 'content-reference', multiple: true, values: [savedCard.path] },
                                {
                                    name: 'collections',
                                    type: 'content-reference',
                                    multiple: true,
                                    values: [savedCategory.path],
                                },
                            ],
                            references: [savedCard, savedCategory],
                            ...overrides,
                        };
                    }

                    async function mountEditor(fragmentData) {
                        const editor = document.createElement('merch-card-collection-editor');
                        editor.updateFragment = () => {};
                        editor.fragmentStore = new FragmentStore(new Fragment(fragmentData));
                        reopenHost.appendChild(editor);
                        await editor.updateComplete;
                        await new Promise((resolve) => setTimeout(resolve, 0));
                        await editor.updateComplete;
                        return editor;
                    }

                    const renderedItemCount = (editor, containerClass) =>
                        editor.shadowRoot.querySelectorAll(`.${containerClass} .item-wrapper`).length;

                    beforeEach(() => {
                        reopenHost = document.createElement('div');
                        spTheme().appendChild(reopenHost);
                    });

                    afterEach(() => {
                        reopenHost?.remove();
                        reopenHost = null;
                    });

                    // Opening a collection from the fragments list activates the list store, whose search
                    // result carries no references; the editor's background refresh fills them in later.
                    it('shows saved cards and categories once references arrive via a later refresh', async () => {
                        const withoutReferences = savedCollectionData({ references: undefined });
                        const editor = await mountEditor(withoutReferences);
                        expect(renderedItemCount(editor, 'cards-container')).to.equal(0);

                        editor.fragmentStore.refreshFrom(savedCollectionData());
                        await editor.updateComplete;
                        await new Promise((resolve) => setTimeout(resolve, 0));
                        await editor.updateComplete;

                        expect(renderedItemCount(editor, 'cards-container')).to.equal(1);
                        expect(renderedItemCount(editor, 'collections-container')).to.equal(1);
                    });

                    it('seeds the fragments picker with only the saved cards', async () => {
                        const editor = await mountEditor(savedCollectionData());
                        Store.collectionCards.selectedCollections.set([savedCategory.path]);

                        editor.shadowRoot
                            .querySelector('.collection-cards-selector-dialog')
                            .dispatchEvent(new Event('sp-opened', { bubbles: true, composed: true }));

                        expect(Store.collectionCards.selectedCards.value).to.deep.equal([savedCard.path]);
                        expect(Store.collectionCards.selectedCollections.value).to.deep.equal([]);
                        expect(Store.collectionCards.cardsByPaths.value.has(savedCard.path)).to.be.true;
                    });

                    it('seeds the categories picker with only the saved categories', async () => {
                        const editor = await mountEditor(savedCollectionData());
                        Store.collectionCards.selectedCards.set([savedCard.path]);

                        editor.shadowRoot
                            .querySelector('.collection-categories-selector-dialog')
                            .dispatchEvent(new Event('sp-opened', { bubbles: true, composed: true }));

                        expect(Store.collectionCards.selectedCollections.value).to.deep.equal([savedCategory.path]);
                        expect(Store.collectionCards.selectedCards.value).to.deep.equal([]);
                        expect(Store.collectionCards.collectionsByPaths.value.has(savedCategory.path)).to.be.true;
                    });

                    describe('confirming a picker on a variation', () => {
                        async function mountVariation() {
                            const editor = document.createElement('merch-card-collection-editor');
                            editor.updateFragment = spy();
                            editor.isVariation = true;
                            editor.localeDefaultFragment = new Fragment(savedCollectionData());
                            editor.fragmentStore = new FragmentStore(
                                new Fragment(
                                    savedCollectionData({
                                        id: 'variation-collection-id',
                                        path: '/content/dam/mas/sandbox/fr_FR/saved-collection',
                                        fields: [
                                            { name: 'cards', type: 'content-reference', multiple: true, values: [] },
                                            { name: 'collections', type: 'content-reference', multiple: true, values: [] },
                                        ],
                                        references: [],
                                    }),
                                ),
                            );
                            reopenHost.appendChild(editor);
                            await editor.updateComplete;
                            await new Promise((resolve) => setTimeout(resolve, 0));
                            await editor.updateComplete;
                            return editor;
                        }

                        const openAndConfirm = (editor, dialogClass) => {
                            const dialog = editor.shadowRoot.querySelector(`.${dialogClass}`);
                            dialog.dispatchEvent(new Event('sp-opened', { bubbles: true, composed: true }));
                            dialog.close = () => {};
                            dialog.dispatchEvent(new Event('confirm'));
                        };

                        it('keeps inherited cards inherited when the selection is unchanged', async () => {
                            const editor = await mountVariation();
                            openAndConfirm(editor, 'collection-cards-selector-dialog');
                            expect(editor.updateFragment.called).to.be.false;
                        });

                        it('keeps inherited categories inherited when the selection is unchanged', async () => {
                            const editor = await mountVariation();
                            openAndConfirm(editor, 'collection-categories-selector-dialog');
                            expect(editor.updateFragment.called).to.be.false;
                        });

                        it('writes a local override once the selection changes', async () => {
                            const editor = await mountVariation();
                            const dialog = editor.shadowRoot.querySelector('.collection-cards-selector-dialog');
                            dialog.dispatchEvent(new Event('sp-opened', { bubbles: true, composed: true }));
                            Store.collectionCards.selectedCards.set([]);
                            dialog.close = () => {};
                            dialog.dispatchEvent(new Event('confirm'));
                            expect(editor.updateFragment.calledOnce).to.be.true;
                            expect(editor.updateFragment.firstCall.args[0].values).to.deep.equal([]);
                        });
                    });

                    it('collapses the selected fragments list with the hide toggle', async () => {
                        const editor = await mountEditor(savedCollectionData());
                        const container = editor.shadowRoot.querySelector('.cards-container');
                        const toggle = editor.shadowRoot.querySelector('#hide-cards');
                        expect(getComputedStyle(container).display).to.not.equal('none');

                        toggle.click();
                        await editor.updateComplete;
                        expect(getComputedStyle(container).display).to.equal('none');
                        expect(editor.shadowRoot.querySelector('[data-field-name="cards-section"] h2').textContent).to.include(
                            'Selected fragments (1)',
                        );
                        expect(editor.shadowRoot.querySelector('.cards-header-actions overlay-trigger')).to.exist;

                        toggle.click();
                        await editor.updateComplete;
                        expect(getComputedStyle(container).display).to.not.equal('none');
                    });

                    it('shows the number of selected categories in the Categories heading', async () => {
                        const editor = await mountEditor(savedCollectionData());
                        const heading = editor.shadowRoot.querySelector('[data-field-name="collections"] h2');
                        expect(heading.textContent.trim()).to.equal('Categories (1)');
                    });
                });
            });
        </script>
        <main>
            <sp-theme system="spectrum-two" color="light" scale="medium"></sp-theme>
        </main>
        <template id="merch-card-collection-editor">
            <div>
                <mas-repository base-url="http://localhost:2023/test/mocks"></mas-repository>
            </div>
        </template>
    </body>
</html>
