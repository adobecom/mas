name: IO Studio Deploy
on:
    workflow_call:
        inputs:
            deploy_ai:
                description: 'Deploy optional AI actions after the core Studio actions'
                type: boolean
                required: false
                default: true
            assistant_only:
                description: 'Refresh only AI actions; fail the job if they cannot be updated'
                type: boolean
                required: false
                default: false
            knowledge_sha256:
                description: 'Require the exact knowledge export that passed validation'
                type: string
                required: false
                default: ''
            run_tests:
                type: boolean
                required: false
                default: true
            batch_size:
                type: number
                required: false
                default: 5
            rps_limit:
                type: number
                required: false
                default: 5
                # NOTE: batch_size must not exceed rps_limit — each batch fires all requests
                # simultaneously, so a batch larger than the RPS limit would burst past the
                # limit before throttling applies.
            worker_concurrency:
                type: number
                required: false
                default: 2
            vault-path:
                description: 'Vault secret path (relative to the cloudtech_wcms mount) holding the workspace creds: env, aio'
                type: string
                required: true
            odin-bucket-path:
                description: 'Vault secret path holding the odin_bucket for the target environment. Defaults to vault-path when omitted.'
                type: string
                required: false
                default: ''
        secrets:
            VAULT_ROLE_ID:
                required: true
            VAULT_SECRET_ID:
                required: true
            MAS_AGENT_READER_APP_KEY:
                required: false
            MAS_AGENT_KNOWLEDGE_TOKEN:
                required: false
        outputs:
            namespace:
                description: 'I/O runtime workspace namespace the app was deployed to'
                value: ${{ jobs.deploy.outputs.namespace }}

jobs:
    tests:
        if: inputs.run_tests == true
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22.23.1
              uses: actions/setup-node@v4
              with:
                  # Pinned: 22.23.1 fixes the node-fetch v2 gzip / ERR_STREAM_PREMATURE_CLOSE
                  # regression introduced in 22.23.0.
                  node-version: '22.23.1'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            # A short-lived, read-only token from the MASA knowledge reader app when its id is set as the
            # MAS_AGENT_READER_APP_ID repository variable; otherwise the MAS_AGENT_KNOWLEDGE_TOKEN secret.
            - name: Mint a mas-agent read token
              id: masa-token
              if: ${{ vars.MAS_AGENT_READER_APP_ID != '' }}
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.MAS_AGENT_READER_APP_ID }}
                  private-key: ${{ secrets.MAS_AGENT_READER_APP_KEY }}
                  owner: adobecom
                  repositories: mas-agent
                  permission-contents: read

            # npm test fetches the mas-agent knowledge corpus first (pretest); the coverage tests need it.
            - name: Run tests
              env:
                  MAS_AGENT_KNOWLEDGE_TOKEN: ${{ steps.masa-token.outputs.token || secrets.MAS_AGENT_KNOWLEDGE_TOKEN }}
              run: npm test

    deploy:
        runs-on: self-hosted
        concurrency:
            group: io-studio-deploy-${{ inputs.vault-path }}
            cancel-in-progress: false
        defaults:
            run:
                working-directory: io/studio
        outputs:
            namespace: ${{ steps.ns.outputs.namespace }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Validate knowledge refresh inputs
              if: inputs.assistant_only
              env:
                  DEPLOY_AI: ${{ inputs.deploy_ai }}
                  KNOWLEDGE_SHA256: ${{ inputs.knowledge_sha256 }}
              run: |
                  if [ "$DEPLOY_AI" != 'true' ] || ! [[ "$KNOWLEDGE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
                      echo '::error::An assistant-only refresh requires AI deployment and a validated export digest.'
                      exit 1
                  fi

            - name: Setup Node.js 22.23.1
              uses: actions/setup-node@v4
              with:
                  # Pinned: 22.23.1 fixes the node-fetch v2 gzip / ERR_STREAM_PREMATURE_CLOSE
                  # regression introduced in 22.23.0.
                  node-version: '22.23.1'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Fetch workspace secrets from Vault
              uses: ./.github/actions/vault-secrets
              with:
                  role-id: ${{ secrets.VAULT_ROLE_ID }}
                  secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  path: ${{ inputs.vault-path }}
                  file-fields: env=.env,aio=.aio
                  working-directory: io/studio

            # odin_bucket is environment-level (QA for PRs, stage/prod on merge), not
            # per-workspace — fetched from its own path (defaults to vault-path).
            - name: Fetch Odin bucket from Vault
              uses: ./.github/actions/vault-secrets
              with:
                  role-id: ${{ secrets.VAULT_ROLE_ID }}
                  secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  path: ${{ inputs.odin-bucket-path || inputs.vault-path }}
                  env-fields: odin_bucket

            # AOS / OST credentials are identical across environments —
            # stored once in a shared path so they don't need to live in every
            # workspace's .env blob.
            - name: Fetch shared service secrets from Vault
              uses: ./.github/actions/vault-secrets
              with:
                  role-id: ${{ secrets.VAULT_ROLE_ID }}
                  secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  path: merch-at-scale/aio-studio/common
                  env-fields: aos_url,aos_api_key,ost_write_api_key

            # Derive namespace from the deployed .env (AIO_runtime_namespace). We must NOT
            # source it from a masked Vault field: GitHub empties job outputs whose value is
            # a masked secret, so it would arrive blank in the health-check job.
            - name: Capture namespace
              id: ns
              run: |
                  ns=$(grep -E '^AIO_runtime_namespace=' .env | head -n1 | cut -d= -f2-)
                  if [ -z "$ns" ]; then echo "::error::AIO_runtime_namespace not found in .env"; exit 1; fi
                  echo "namespace=$ns" >> "$GITHUB_OUTPUT"

            - name: Deploy core Studio actions
              if: inputs.assistant_only != true
              env:
                  ODIN_ENDPOINT: https://author-p22655-${{ env.ODIN_BUCKET }}.adobeaemcloud.com
                  BATCH_SIZE: ${{ inputs.batch_size }}
                  RPS_LIMIT: ${{ inputs.rps_limit }}
                  WORKER_CONCURRENCY: ${{ inputs.worker_concurrency }}
              run: node scripts/deploy-actions.mjs core

            - name: Fetch optional AI secrets from Vault
              id: ai-secrets
              if: inputs.deploy_ai
              continue-on-error: true
              uses: ./.github/actions/vault-secrets
              with:
                  role-id: ${{ secrets.VAULT_ROLE_ID }}
                  secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  path: merch-at-scale/aio-studio/common
                  env-fields: ai_foundry_api_key

            # A short-lived, read-only token from the MASA knowledge reader app when its id is set as the
            # MAS_AGENT_READER_APP_ID repository variable; otherwise the MAS_AGENT_KNOWLEDGE_TOKEN secret.
            - name: Mint a mas-agent read token
              id: masa-token
              if: inputs.deploy_ai && steps.ai-secrets.outcome == 'success' && vars.MAS_AGENT_READER_APP_ID != ''
              continue-on-error: true
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.MAS_AGENT_READER_APP_ID }}
                  private-key: ${{ secrets.MAS_AGENT_READER_APP_KEY }}
                  owner: adobecom
                  repositories: mas-agent
                  permission-contents: read

            - name: Fetch the mas-agent knowledge corpus
              id: masa-knowledge
              if: inputs.deploy_ai && steps.ai-secrets.outcome == 'success' && (vars.MAS_AGENT_READER_APP_ID == '' || steps.masa-token.outcome == 'success')
              continue-on-error: true
              env:
                  MAS_AGENT_KNOWLEDGE_TOKEN: ${{ steps.masa-token.outputs.token || secrets.MAS_AGENT_KNOWLEDGE_TOKEN }}
                  MAS_AGENT_KNOWLEDGE_SHA256: ${{ inputs.knowledge_sha256 }}
              run: npm run fetch:masa-knowledge -- --required --expected-sha256 "$MAS_AGENT_KNOWLEDGE_SHA256"

            # A scheduled refresh must not roll back application code if main advanced while it
            # waited for the workspace deployment lock. A subsequent refresh uses the newer main.
            - name: Check refresh still uses current main
              if: inputs.assistant_only
              run: |
                  set -euo pipefail
                  current=$(git ls-remote origin refs/heads/main | cut -f1)
                  if [ "$(git rev-parse HEAD)" != "$current" ]; then
                      echo '::error::Main advanced during knowledge refresh; rerun against current main.'
                      exit 1
                  fi

            - name: Deploy optional AI actions
              id: ai-deploy
              if: inputs.deploy_ai && steps.ai-secrets.outcome == 'success' && steps.masa-knowledge.outcome == 'success'
              continue-on-error: true
              env:
                  ODIN_ENDPOINT: https://author-p22655-${{ env.ODIN_BUCKET }}.adobeaemcloud.com
                  BATCH_SIZE: ${{ inputs.batch_size }}
                  RPS_LIMIT: ${{ inputs.rps_limit }}
                  WORKER_CONCURRENCY: ${{ inputs.worker_concurrency }}
                  # Endpoint and model ids are not secrets; only the key comes from
                  # Vault, as $AI_FOUNDRY_API_KEY. Thinking stays off: on Qwen-latest
                  # it costs ~25s a turn and corrupts forced tool calls.
                  AI_FOUNDRY_BASE_URL: https://ehl.infra.adobe.net/v1
                  AI_FOUNDRY_MODEL_ID: aifoundry/Qwen/Qwen-latest
                  AI_FOUNDRY_FAST_MODEL_ID: aifoundry/Qwen/Qwen-latest
                  AI_FOUNDRY_THINKING: 'off'
              run: node scripts/deploy-actions.mjs assistant

            - name: Report optional AI deployment failure
              if: inputs.deploy_ai && (steps.ai-secrets.outcome == 'failure' || steps.masa-token.outcome == 'failure' || steps.masa-knowledge.outcome == 'failure' || steps.ai-deploy.outcome == 'failure')
              env:
                  ASSISTANT_ONLY: ${{ inputs.assistant_only }}
              run: |
                  if [ "$ASSISTANT_ONLY" = 'true' ]; then
                      echo '::error::Knowledge refresh failed. Check the AI deployment steps before retrying.'
                      exit 1
                  fi
                  echo '::warning::AI actions were not updated. Core Studio actions were deployed successfully.'
