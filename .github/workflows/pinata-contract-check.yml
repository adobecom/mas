name: Check Piñata configuration

on:
    pull_request:
        paths:
            - '.pinata/**'
            - '.github/workflows/pinata-contract-check.yml'
    push:
        branches: [main]
        paths:
            - '.pinata/**'
            - '.github/workflows/pinata-contract-check.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    contract:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python -m pip install PyYAML==6.0.2
            - run: python .pinata/scripts/check-contract.py --skip-registry
            - run: python -m unittest discover -s .pinata/scripts -p 'test_contract.py' -v
            - run: bash .pinata/scripts/test-preview-supervisor.sh
