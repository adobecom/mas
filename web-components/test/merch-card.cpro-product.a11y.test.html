<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Merch Card CPro Product Accessibility Test</title>
        <script>
            window.process = {
                env: {},
            };
        </script>
        <mas-commerce-service env="stage"></mas-commerce-service>
    </head>

    <body>
        <script
            type="module"
            src="./merch-card.cpro-product.a11y.test.html.js"
        ></script>
        <main>
            <merch-card id="cpro-product" variant="pro">
                <h3 slot="heading-xs">Image Editing</h3>
                <p slot="subtitle">Creative Cloud Pro</p>
                <div slot="body-xs">
                    <p>Edit and composite images.</p>
                </div>
                <p slot="heading-m">
                    <span is="inline-price" data-wcs-osi="puf"></span>
                    <span
                        is="inline-price"
                        data-template="legal"
                        data-wcs-osi="puf"
                    ></span>
                    <span
                        is="inline-price"
                        data-template="discount"
                        data-wcs-osi="puf"
                    ></span>
                </p>
                <div slot="footer">
                    <a href="https://www.adobe.com/buy" class="con-button blue"
                        >Buy now</a
                    >
                    <a href="https://www.adobe.com/learn" class="con-button"
                        >Learn more</a
                    >
                </div>
                <div slot="whats-included">
                    <ul>
                        <li>Feature one</li>
                    </ul>
                </div>
            </merch-card>
        </main>
    </body>
</html>
