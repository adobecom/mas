name: Run Nala on Milolibs

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Provide the live branch url. ex: https://main--mas--adobecom.aem.live'
                required: false
                type: string
            milolibs:
                description: 'Provide Milolibs param. (with "?") ex: ?milolibs=stage--milo--adobecom'
                required: false
                type: string
            tags:
                description: 'Test scenario tags, if empty all tests will run. i.e., @mas-studio'
                required: false
                type: string

jobs:
    platform_matrix:
        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x]
        name: Running tests
        runs-on: [self-hosted, Linux, X64]
        env:
            WORKFLOW_NAME: 'Milo Libs Run'
            MILO_LIBS_RUN: 'true'

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            - name: Install Playwright system dependencies
              uses: ./.github/actions/prep-apt

            - name: Install Playwright browsers
              run: npx playwright install

            - name: Set environment variables
              run: |
                  echo "PR_BRANCH_MILOLIBS_LIVE_URL=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
                  echo "MILO_LIBS=${{ github.event.inputs.milolibs }}" >> $GITHUB_ENV

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Run Nala Tests with Milolibs via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: ${{ inputs.tags }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
                  FORCE_COLOR: 3 # Force color output
                  # 4 workers × 45 RPS/worker = 180 RPS combined, safely under the 200 RPS
                  # per-hostname limit enforced by AEM.live. Raise only if EDS grants a higher cap.
                  NALA_PLAYWRIGHT_WORKERS: 3
                  NALA_DIAGNOSTICS: 'true'

            - name: Strip network data from diagnostic traces
              if: always()
              run: |
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  from zipfile import ZipFile, ZIP_DEFLATED
                  for path in Path('test-results').rglob('trace.zip'):
                      sanitized = path.with_name('sanitized-trace.zip')
                      with ZipFile(path) as source, ZipFile(sanitized, 'w', ZIP_DEFLATED) as target:
                          for item in source.infolist():
                              if item.filename.endswith('.network'):
                                  continue
                              if item.filename.startswith('resources/') and not item.filename.endswith(('.jpeg', '.png')):
                                  continue
                              data = source.read(item.filename)
                              if item.filename.endswith('.trace'):
                                  events = [json.loads(line) for line in data.decode().splitlines()]
                                  for event in events:
                                      if event.get('type') == 'context-options':
                                          event.get('options', {}).pop('storageState', None)
                                  data = ('\n'.join(json.dumps(event) for event in events) + '\n').encode()
                              target.writestr(item, data)
                      sanitized.replace(path)
                  PY

            - name: Upload diagnostic evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nala-discard-diagnostics
                  retention-days: 1
                  path: |
                      test-results/**/trace.zip
                      test-results/**/test-failed-*.png
                      test-results/**/error-context.md
                      test-results/**/attachments/*.json

            - name: Cleanup cloned cards
              if: always()
              run: node -e "
                  import('./nala/utils/global.teardown.js')
                  .then(module => module.default())
                  .catch(err => {
                  console.error('Cleanup failed:', err.message);
                  process.exit(1);
                  });"
              env:
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
