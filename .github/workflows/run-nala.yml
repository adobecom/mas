name: Run Nala Tests

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, labeled, unlabeled]
    # Re-evaluate when a review lands, so an already-labeled PR starts Nala
    # as soon as it reaches the required approval count.
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

env:
    REQUIRED_APPROVALS: 2

# Prevent multiple runs from happening at the same time. Keyed on the PR number
# so pull_request and pull_request_review runs for the same PR share a group.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    check-paths:
        name: Check Changed Paths
        runs-on: ubuntu-latest
        outputs:
            is-trivial: ${{ steps.filter.outputs.trivial }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # pull_request_review defaults to the base branch; pin the PR head
                  # so the diff is computed against the PR, not main against main.
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
            - name: Detect trivial-only changes
              id: filter
              uses: ./.github/actions/detect-trivial
              with:
                  base-ref: ${{ github.event.pull_request.base.ref }}

    check-approvals:
        name: Check Label and Approvals
        runs-on: ubuntu-latest
        outputs:
            has-label: ${{ steps.check.outputs.has-label }}
            can-run: ${{ steps.check.outputs.can-run }}
        steps:
            - name: Count current approvals
              id: check
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
              with:
                  script: |
                      const required = Number(process.env.REQUIRED_APPROVALS);
                      const pr = context.payload.pull_request;
                      const hasLabel = pr.labels.some((label) => label.name === 'run nala');

                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pr.number,
                          per_page: 100,
                      });

                      // Only the latest APPROVED/CHANGES_REQUESTED/DISMISSED review per
                      // reviewer counts; COMMENTED reviews never supersede an approval.
                      const latestByReviewer = new Map();
                      for (const review of reviews) {
                          if (review.state === 'COMMENTED' || !review.user) continue;
                          latestByReviewer.set(review.user.id, {
                              login: review.user.login,
                              state: review.state,
                          });
                      }

                      // An approval only counts from someone who can push to the repo.
                      // Without this, any account's approval plus the label would run
                      // PR-authored code on the self-hosted runners.
                      const approvers = [...latestByReviewer.values()].filter(
                          (review) => review.state === 'APPROVED',
                      );
                      const canWrite = async (login) => {
                          try {
                              const { data } =
                                  await github.rest.repos.getCollaboratorPermissionLevel({
                                      owner: context.repo.owner,
                                      repo: context.repo.repo,
                                      username: login,
                                  });
                              return data.permission === 'admin' || data.permission === 'write';
                          } catch {
                              return false;
                          }
                      };
                      const permissions = await Promise.all(
                          approvers.map((review) => canWrite(review.login)),
                      );
                      const approvals = permissions.filter(Boolean).length;

                      const canRun = hasLabel && approvals >= required;
                      const summary = `'run nala' label: ${hasLabel}, approvals: ${approvals}/${required}`;
                      if (canRun) {
                          core.info(`Nala will run — ${summary}`);
                      } else {
                          core.notice(`Nala skipped — ${summary}`);
                      }

                      core.setOutput('has-label', String(hasLabel));
                      core.setOutput('can-run', String(canRun));

    nala-gate:
        name: Nala Gate
        needs: [check-paths, check-approvals]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Fail if a prerequisite job did not succeed
              if: needs.check-paths.result != 'success' || needs.check-approvals.result != 'success'
              env:
                  CHECK_PATHS_RESULT: ${{ needs.check-paths.result }}
                  CHECK_APPROVALS_RESULT: ${{ needs.check-approvals.result }}
              run: |
                  echo "::error::Prerequisite job did not succeed (check-paths: ${CHECK_PATHS_RESULT}, check-approvals: ${CHECK_APPROVALS_RESULT})"
                  exit 1
            - name: Pass gate for trivial PRs
              if: needs.check-paths.outputs.is-trivial == 'true'
              run: echo "Trivial PR — skipping Nala gate"
            - name: Require 'run nala' label
              # Merge requirement is label-only — approvals are enforced by branch
              # protection, not here. The only bypass is the git-computed is-trivial
              # output from check-paths, never the mutable 'trivial' label.
              if: |
                  needs.check-paths.outputs.is-trivial != 'true' &&
                  needs.check-approvals.outputs.has-label != 'true'
              run: |
                  echo "::error::Add the 'run nala' label to merge this PR"
                  exit 1

    run-nala-studio-tests:
        name: Running Nala Studio E2E UI Tests
        needs: [nala-gate, check-paths, check-approvals]
        if: |
            needs.nala-gate.result == 'success' &&
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true'
        runs-on: [self-hosted, Linux, X64]
        timeout-minutes: 45 # Prevent hanging jobs
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 2

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            - name: Install Playwright system dependencies
              uses: ./.github/actions/prep-apt

            - name: Install/verify Playwright browsers
              run: |
                  # Always run this - it's idempotent and fast when browsers are already correct
                  # It checks version compatibility and only installs if browsers are missing or outdated
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Run Nala Studio Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-studio ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
                  FORCE_COLOR: 3 # Force color output
                  # studio:3 + docs:1 = 4 workers × 45 RPS = 180 RPS, safely under 200 RPS EDS limit.
                  # Both jobs share the same self-hosted runner pool — 4 total workers = 4 vCPUs.
                  NALA_PLAYWRIGHT_WORKERS: 3

            - name: Cleanup cloned cards
              if: always()
              run: node -e "
                  import('./nala/utils/global.teardown.js')
                  .then(module => module.default())
                  .catch(err => {
                  console.error('Cleanup failed:', err.message);
                  process.exit(1);
                  });"
              env:
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}

    run-nala-docs-tests:
        name: Running Nala Docs E2E UI Tests
        needs: [nala-gate, check-paths, check-approvals]
        if: |
            needs.nala-gate.result == 'success' &&
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true'
        runs-on: [self-hosted, Linux, X64]
        timeout-minutes: 20 # Prevent hanging jobs
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Fetch base branch for diff
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch origin "${BASE_REF}"

            - name: Detect io/www changes
              id: filter
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  if git diff --quiet "origin/${BASE_REF}...HEAD" -- io/www/ 2>/dev/null; then
                      echo "io-www=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "io-www=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            # Docs tests run on GitHub-hosted runners (ubuntu-latest) — no unattended-upgrades
            # lock contention, so the prep-apt composite action is not needed here.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install-deps

            - name: Install/verify Playwright browsers
              run: |
                  # Always run this - it's idempotent and fast when browsers are already correct
                  # It checks version compatibility and only installs if browsers are missing or outdated
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Set MAS_IO_URL when io/www has changes
              if: steps.filter.outputs.io-www == 'true'
              env:
                  ACTOR_NS: ${{ secrets[format('AIO_NS_{0}', github.event.pull_request.user.login)] }}
                  ACTOR_LOGIN: ${{ github.event.pull_request.user.login }}
              run: |
                  if [ -z "$ACTOR_NS" ]; then
                    echo "::error::Missing AIO namespace secret AIO_NS_${ACTOR_LOGIN} for PR author"
                    exit 1
                  fi
                  echo "Using AIO namespace for PR author ${ACTOR_LOGIN}"
                  echo "MAS_IO_URL=?mas-io-url=https://${ACTOR_NS}.adobeioruntime.net/api/v1/web/MerchAtScale" >> "$GITHUB_ENV"

            - name: Run Nala Docs Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-docs ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  FORCE_COLOR: 3 # Force color output
                  NALA_PLAYWRIGHT_WORKERS: 1
