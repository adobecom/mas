name: Install Playwright system dependencies
description: >
    Waits for dpkg/apt locks without interrupting runner updates, then installs
    Playwright system dependencies with bounded retries.

inputs:
    browser:
        description: Optional Playwright browser whose system dependencies need repair.
        default: ''

runs:
    using: composite
    steps:
        - name: Wait for apt locks
          shell: bash
          run: |
              sudo -n true
              echo "Waiting for apt locks to clear..."
              timeout 90 bash -c '
                while sudo -n fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                                 /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                                 2>/dev/null; do
                  echo "  apt lock held, retrying in 5s..."
                  sleep 5
                done
              ' || {
                echo "::error::Runner package manager is still busy after 90 seconds; its update was not interrupted."
                exit 1
              }

        - name: Install Playwright system dependencies (with retry)
          shell: bash
          env:
              PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
          run: |
              browsers=()
              if [ -n "$PLAYWRIGHT_BROWSER" ]; then browsers+=("$PLAYWRIGHT_BROWSER"); fi
              for attempt in 1 2; do
                echo "Attempt $attempt: npx playwright install-deps"
                timeout 120 npx --no-install playwright install-deps "${browsers[@]}" && break
                if [ $attempt -lt 2 ]; then
                  echo "::warning::Dependency repair failed; retrying once in 10s."
                  sleep 10
                else
                  echo "All attempts failed"
                  exit 1
                fi
              done
