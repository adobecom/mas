<!doctype html>
<html>
    <head>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <title>mas-user-picker unit tests</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="../../src/swc.js" type="module"></script>
        <style>
            main {
                display: flex;
                flex-direction: column;
                gap: 32px;
            }

            sp-theme {
                display: contents;
            }

            mas-user-picker {
                position: relative;
            }
        </style>
    </head>

    <body>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { delay, initElementFromTemplate, oneEvent } from '../utils.js';
            import '../../src/fields/user-picker.js';
            import { ReactiveStore } from '../../src/reactivity/reactive-store.js';

            let spTheme = document.querySelector('sp-theme');

            // Helper to initialize element using template cloning
            async function initUserPicker(templateId, testTitle) {
                const template = document.getElementById(templateId);
                if (!template) {
                    throw new Error(`Template with id "${templateId}" not found.`);
                }
                const picker = template.content.firstElementChild.cloneNode(true);
                picker.users = new ReactiveStore(mockUsers);
                picker.currentUser = new ReactiveStore({
                    email: 'user3@example.com',
                });
                picker.selectedUsers = new ReactiveStore([]);
                const title = document.createElement('p');
                title.textContent = testTitle;
                spTheme.appendChild(title);
                spTheme.appendChild(picker);
                return picker;
            }

            // Mock user data
            const mockUsers = [
                {
                    displayName: 'John Doe',
                    userPrincipalName: 'user1@example.com',
                },
                {
                    displayName: 'Jane Smith',
                    userPrincipalName: 'user2@example.com',
                },
                {
                    displayName: 'Alex Johnson',
                    userPrincipalName: 'user3@example.com',
                },
                {
                    displayName: 'Maria Garcia',
                    userPrincipalName: 'user4@example.com',
                },
                {
                    displayName: 'Robert Chen',
                    userPrincipalName: 'user5@example.com',
                },
            ];

            runTests(async () => {
                describe('mas-user-picker custom element', async () => {
                    it('should display current user at the top of the list', async function () {
                        const picker = await initUserPicker('createdBy1', this.test.title);
                        await picker.updateComplete;
                        await delay(100);
                        picker.open = true;
                        await picker.updateComplete;
                        await delay(200);
                        const checkbox = picker.shadowRoot.querySelector('sp-checkbox');
                        expect(checkbox).to.not.be.null;
                        expect(checkbox.innerText.trim()).to.equal('Alex Johnson');
                    });

                    it('updates the selected count when users are checked before apply', async function () {
                        const picker = await initUserPicker('createdBy1', this.test.title);
                        picker.open = true;
                        await picker.updateComplete;
                        const footerText = () => picker.shadowRoot.querySelector('#footer span').textContent;
                        expect(footerText()).to.equal('No users selected');

                        const menuItems = picker.shadowRoot.querySelectorAll('sp-menu-item');
                        menuItems[0].click();
                        await picker.updateComplete;
                        expect(footerText()).to.equal('1 user selected');

                        menuItems[1].click();
                        await picker.updateComplete;
                        expect(footerText()).to.equal('2 users selected');
                        expect(picker.selectedUsers.value).to.have.length(0);

                        await picker.applySelection();
                        expect(picker.selectedUsers.value.map(({ userPrincipalName }) => userPrincipalName)).to.have.members([
                            'user3@example.com',
                            'user2@example.com',
                        ]);
                    });

                    it('clears the selected count on reset', async function () {
                        const picker = await initUserPicker('createdBy1', this.test.title);
                        picker.selectedUsers.set([mockUsers[0]]);
                        picker.open = true;
                        await picker.updateComplete;
                        expect(picker.shadowRoot.querySelector('#footer span').textContent).to.equal('1 user selected');

                        picker.resetSelection();
                        await picker.updateComplete;
                        expect(picker.shadowRoot.querySelector('#footer span').textContent).to.equal('No users selected');
                        expect(picker.shadowRoot.querySelector('sp-checkbox[checked]')).to.be.null;
                    });

                    it('renders a quiet trigger by default', async function () {
                        const picker = await initUserPicker('createdBy1', this.test.title);
                        await picker.updateComplete;
                        expect(picker.shadowRoot.querySelector('sp-action-button').hasAttribute('quiet')).to.be.true;
                    });

                    it('renders an outlined trigger when quiet is false', async function () {
                        const picker = await initUserPicker('createdBy1', this.test.title);
                        picker.quiet = false;
                        await picker.updateComplete;
                        expect(picker.shadowRoot.querySelector('sp-action-button').hasAttribute('quiet')).to.be.false;
                    });
                });
            });
        </script>
        <main>
            <sp-theme system="spectrum-two" color="light" scale="medium"></sp-theme>
        </main>
        <template id="createdBy1">
            <mas-user-picker label="Created by"></mas-user-picker>
        </template>
    </body>
</html>
