name: IO Studio Candidate Deploy
# Dispatched by Piñata's io-studio-candidate gate (.pinata/scripts/deploy-candidate-io.sh)
# with --ref <candidate branch>, before any PR exists. Deploys io/studio to the
# dispatcher's workspace, resolved like a PR author's (resolve-aio-identity.yaml:
# pinatacode[bot] -> the shared bot workspace on the stage Odin bucket), then
# health-checks it.
on:
    workflow_dispatch:

jobs:
    identity:
        uses: ./.github/workflows/resolve-aio-identity.yaml
        with:
            login: ${{ github.actor }}

    # A candidate that changes CI or Piñata config could redirect this run's Vault
    # access. This file itself is out of the App's reach (no Workflows permission),
    # so the check holds even when the candidate branch is hostile.
    # The candidate's own io/studio code (npm ci, aio app deploy hooks) still runs on
    # the self-hosted deploy runner with the bot workspace's .env present. That is
    # only acceptable while that runner is ephemeral, as for bot PR deploys today.
    guard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Refuse candidates that change CI or Piñata config
              run: |
                  changed=$(git diff --name-only origin/main...HEAD -- .github .pinata)
                  if [ -n "$changed" ]; then
                      echo "::error::Candidate changes CI or Piñata config; a human must deploy it."
                      echo "$changed"
                      exit 1
                  fi

    deploy:
        needs: [identity, guard]
        # Same group as io-studio-pr.yaml's deploy for the same identity.
        concurrency:
            group: io-studio-merch-at-scale/aio-studio/${{ needs.identity.outputs.vault_login }}
            cancel-in-progress: false
        uses: ./.github/workflows/io-studio-deploy.yaml
        with:
            run_tests: true
            vault-path: merch-at-scale/aio-studio/${{ needs.identity.outputs.vault_login }}
            odin-bucket-path: ${{ needs.identity.outputs.odin_bucket_path }}
            shared-secrets: ${{ fromJSON(needs.identity.outputs.shared_secrets) }}
        secrets: inherit

    test-deployed:
        needs: deploy
        uses: ./.github/workflows/io-studio-tests.yaml
        with:
            namespace: ${{ needs.deploy.outputs.namespace }}
