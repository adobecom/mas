name: Unit Tests
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
jobs:
    run-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: run npm clean install
              run: npm ci

            - name: Force update @adobecom/milo dependency
              run: npm add github:adobecom/milo#stage

            - name: Install XVFB
              run: sudo apt-get install xvfb

            # Fork and Dependabot PRs receive no repository secrets, so they cannot read mas-agent.
            - name: Check mas-agent read access
              id: masa-access
              env:
                  AVAILABLE: ${{ secrets.MAS_AGENT_READER_APP_KEY != '' || secrets.MAS_AGENT_KNOWLEDGE_TOKEN != '' }}
              run: echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

            # A short-lived, read-only token from the MASA knowledge reader app when its id is set as the
            # MAS_AGENT_READER_APP_ID repository variable; otherwise the MAS_AGENT_KNOWLEDGE_TOKEN secret.
            - name: Mint a mas-agent read token
              id: masa-token
              if: steps.masa-access.outputs.available == 'true' && vars.MAS_AGENT_READER_APP_ID != ''
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.MAS_AGENT_READER_APP_ID }}
                  private-key: ${{ secrets.MAS_AGENT_READER_APP_KEY }}
                  owner: adobecom
                  repositories: mas-agent
                  permission-contents: read

            # io/studio's tests fetch the mas-agent knowledge corpus first (pretest); its coverage tests need it.
            - name: Run the tests
              env:
                  MAS_AGENT_KNOWLEDGE_TOKEN: ${{ steps.masa-token.outputs.token || secrets.MAS_AGENT_KNOWLEDGE_TOKEN }}
                  MAS_AGENT_ACCESS: ${{ steps.masa-access.outputs.available }}
              run: |
                  if [ "$MAS_AGENT_ACCESS" = 'true' ]; then
                      xvfb-run -a npm test
                  else
                      echo '::notice::Skipping io/studio: its tests need mas-agent read access, which this run does not have.'
                      mapfile -t workspaces < <(node -p "require('./package.json').workspaces.filter((name) => name !== 'io/studio').map((name) => '--workspace=' + name).join('\n')")
                      xvfb-run -a npm run test:ci "${workspaces[@]}"
                  fi

            - name: Run the .github script tests
              run: node --test ".github/scripts/*.test.mjs"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: studio/coverage/lcov.info,web-components/coverage/lcov.info,io/studio/coverage/lcov.info,ost/coverage/lcov.info
