name: Build Linux Dist (Temporary)
on:
    push:
        branches: [MWPW-203850]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: MWPW-203850
                  token: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - run: npm ci
            - run: npm run build
              working-directory: web-components
            - name: Commit Linux dist files
              run: |
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  git add web-components/dist/
                  if ! git diff --cached --quiet; then
                    git commit -m "chore: rebuild dist on Linux [skip ci]"
                    git push origin MWPW-203850
                  else
                    echo "No changes to commit"
                  fi
