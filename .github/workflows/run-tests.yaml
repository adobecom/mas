name: Unit Tests
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
jobs:
    run-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: run npm clean install
              run: npm ci

            - name: Force update @adobecom/milo dependency
              run: npm add github:adobecom/milo#stage

            - name: Install XVFB
              run: sudo apt-get install xvfb

            # A short-lived, read-only token from the MASA knowledge reader app when its id is set as the
            # MAS_AGENT_READER_APP_ID repository variable; otherwise the MAS_AGENT_KNOWLEDGE_TOKEN secret.
            - name: Mint a mas-agent read token
              id: masa-token
              if: ${{ vars.MAS_AGENT_READER_APP_ID != '' }}
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.MAS_AGENT_READER_APP_ID }}
                  private-key: ${{ secrets.MAS_AGENT_READER_APP_KEY }}
                  owner: adobecom
                  repositories: mas-agent
                  permission-contents: read

            # io/studio's tests fetch the mas-agent knowledge corpus first (pretest); its coverage tests need it.
            - name: Run the tests
              env:
                  MAS_AGENT_KNOWLEDGE_TOKEN: ${{ steps.masa-token.outputs.token || secrets.MAS_AGENT_KNOWLEDGE_TOKEN }}
              run: xvfb-run -a npm test

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: studio/coverage/lcov.info,web-components/coverage/lcov.info,io/studio/coverage/lcov.info,ost/coverage/lcov.info
