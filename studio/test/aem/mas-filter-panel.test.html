<!doctype html>
<html>
    <head>
        <script>
            window.__swc = { warn: () => {} };
        </script>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <title>mas-filter-panel unit tests</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="../../src/swc.js" type="module"></script>
        <style>
            main {
                display: flex;
                flex-direction: column;
                gap: 32px;
            }

            sp-theme {
                display: contents;
            }

            mas-filter-panel {
                position: relative;
            }
        </style>
    </head>

    <body>
        <script>
            window.adobeIMS = {
                getProfile: async () => ({
                    email: 'test@test.com',
                }),
            };
        </script>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { delay, initElementFromTemplate } from '../utils.js';
            import Store from '../../src/store.js';
            import '../../src/aem/mas-filter-panel.js';
            import '../../src/aem/aem-tag-picker-field.js';
            import '../../src/fields/user-picker.js';

            async function clickTagClearButton(filterPanel, tagPath) {
                const tags = filterPanel.shadowRoot.querySelectorAll('sp-tag');
                const tag = Array.from(tags).find((t) => t.value?.path === tagPath);
                tag.dispatchEvent(new CustomEvent('delete', { bubbles: true, composed: true }));
                await delay(50);
            }

            runTests(async () => {
                let fetchPromise;
                const originalFetch = window.fetch;
                window.fetch = async () => {
                    fetchPromise = originalFetch('/test/mocks/tags.json');
                    return fetchPromise;
                };
                describe('mas-filter-panel custom element', async () => {
                    beforeEach(async function () {
                        Store.filters.set({
                            tags: '',
                        });
                    });

                    it('Should initialize with empty tag values', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;
                        expect(filterPanel.tagsByType).to.deep.equal({
                            custom: [],
                            customer_segment: [],
                            market_segments: [],
                            offer_type: [],
                            plan_type: [],
                            product_code: [],
                            pzn: [],
                            'studio/content-type': [],
                            variant: [],
                        });
                        expect(Store.filters.get().personalizationFilterEnabled).to.be.false;
                    });

                    it('renders the five publication statuses and writes them to Store.filters.status', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const picker = filterPanel.shadowRoot.querySelector('[data-filter-type="status"]');
                        expect(picker, 'status picker should exist').to.exist;

                        const labels = [...picker.querySelectorAll('sp-checkbox')].map((item) => item.textContent.trim());
                        expect(labels).to.deep.equal(['Published', 'Draft', 'New', 'Modified', 'Unpublished']);

                        expect(
                            filterPanel.shadowRoot.querySelector('aem-tag-picker-field[top="status"]'),
                            'no status tag picker',
                        ).to.not.exist;

                        const draftCheckbox = [...picker.querySelectorAll('sp-checkbox')].find(
                            (item) => item.getAttribute('value') === 'DRAFT',
                        );
                        draftCheckbox.checked = true;
                        draftCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await filterPanel.updateComplete;

                        expect(Store.filters.get().status).to.equal('DRAFT');
                    });

                    it('Should update tags when a tag is selected', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const offerTypePicker = filterPanel.shadowRoot.querySelector('aem-tag-picker-field[top="offer_type"]');
                        expect(offerTypePicker).to.not.be.null;

                        await offerTypePicker.toggleTag('/content/cq:tags/mas/offer_type/base');
                        expect(filterPanel.tagsByType.offer_type).to.have.lengthOf(1);
                    });

                    it('Should update store when a status checkbox is checked', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const statusPicker = filterPanel.shadowRoot.querySelector('[data-filter-type="status"]');
                        expect(statusPicker).to.not.be.null;

                        const draftCheckbox = [...statusPicker.querySelectorAll('sp-checkbox')].find(
                            (item) => item.getAttribute('value') === 'DRAFT',
                        );
                        draftCheckbox.checked = true;
                        draftCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await filterPanel.updateComplete;

                        const storeState = await Store.filters.get();
                        expect(storeState.status).to.equal('DRAFT');
                    });

                    it('Should clear status filter when reset is clicked', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const statusPicker = filterPanel.shadowRoot.querySelector('[data-filter-type="status"]');
                        const draftCheckbox = [...statusPicker.querySelectorAll('sp-checkbox')].find(
                            (item) => item.getAttribute('value') === 'DRAFT',
                        );
                        draftCheckbox.checked = true;
                        draftCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await filterPanel.updateComplete;
                        expect(Store.filters.get().status).to.equal('DRAFT');

                        // Click reset button
                        const resetButton = filterPanel.shadowRoot.querySelector('sp-action-button[title="Clear all filters"]');
                        resetButton.click();

                        await filterPanel.updateComplete;
                        expect(Object.values(filterPanel.tagsByType).flat()).to.have.lengthOf(0);
                        expect(Store.filters.get().status).to.be.undefined;

                        const storeState = await Store.search.get();
                        expect(storeState.tags).to.undefined;
                    });

                    it('Should maintain tag filters when the status filter changes', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const statusPicker = filterPanel.shadowRoot.querySelector('[data-filter-type="status"]');
                        const draftCheckbox = [...statusPicker.querySelectorAll('sp-checkbox')].find(
                            (item) => item.getAttribute('value') === 'DRAFT',
                        );
                        draftCheckbox.checked = true;
                        draftCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await filterPanel.updateComplete;

                        // Add offer type tag
                        const offerTypePicker = filterPanel.shadowRoot.querySelector('aem-tag-picker-field[top="offer_type"]');
                        await offerTypePicker.toggleTag('/content/cq:tags/mas/offer_type/base');

                        expect(filterPanel.tagsByType.offer_type).to.have.lengthOf(1);
                        expect(Store.filters.get().status).to.equal('DRAFT');

                        // Change status selection
                        draftCheckbox.checked = false;
                        draftCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        const newCheckbox = [...statusPicker.querySelectorAll('sp-checkbox')].find(
                            (item) => item.getAttribute('value') === 'NEW',
                        );
                        newCheckbox.checked = true;
                        newCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await filterPanel.updateComplete;

                        const storeState = await Store.filters.get();
                        expect(storeState.tags).to.include('mas:offer_type/base');
                        expect(storeState.status).to.equal('NEW');
                    });

                    it('Should only delete the clicked tag when delete icon is clicked', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const offerTypePicker = filterPanel.shadowRoot.querySelector('aem-tag-picker-field[top="offer_type"]');
                        const customerSegmentPicker = filterPanel.shadowRoot.querySelector(
                            'aem-tag-picker-field[top="customer_segment"]',
                        );

                        const basePath = '/content/cq:tags/mas/offer_type/base';
                        const individualPath = '/content/cq:tags/mas/customer_segment/individual';
                        // Add tags
                        await offerTypePicker.toggleTag(basePath);
                        await customerSegmentPicker.toggleTag(individualPath);
                        await filterPanel.updateComplete;

                        // Verify initial tags
                        const initialTags = filterPanel.shadowRoot.querySelectorAll('sp-tag');
                        let tagLabels = Array.from(initialTags).map((tag) => tag.textContent.trim());
                        expect(tagLabels).to.include('BASE');
                        expect(tagLabels).to.include('INDIVIDUAL');

                        await clickTagClearButton(filterPanel, basePath);

                        await filterPanel.updateComplete;

                        // Verify state
                        expect(filterPanel.tagsByType.offer_type).to.have.lengthOf(0);
                        expect(filterPanel.tagsByType.customer_segment).to.have.lengthOf(1);

                        // Verify rendered tags
                        const remainingTags = filterPanel.shadowRoot.querySelectorAll('sp-tag');
                        tagLabels = Array.from(remainingTags).map((tag) => tag.textContent.trim());
                        expect(tagLabels).to.include('INDIVIDUAL');
                        expect(tagLabels).to.not.include('BASE');
                    });

                    it('Should initialize filters from search state', async function () {
                        // Set initial search state
                        Store.filters.set({
                            tags: 'mas:offer_type/base',
                            status: 'DRAFT',
                        });

                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        // Verify tags were initialized correctly
                        expect(filterPanel.tagsByType.offer_type).to.have.lengthOf(1);
                        expect(filterPanel.selectedStatuses).to.deep.equal(['DRAFT']);

                        const offerTypeTag = filterPanel.tagsByType.offer_type[0];
                        expect(offerTypeTag.path).to.equal('/content/cq:tags/mas/offer_type/base');
                        expect(offerTypeTag.title).to.equal('BASE');
                        expect(offerTypeTag.top).to.equal('offer_type');

                        await filterPanel.updateComplete;

                        // Verify offer type tag is rendered as a chip
                        const tags = filterPanel.shadowRoot.querySelectorAll('sp-tag');
                        const tagLabels = Array.from(tags).map((tag) => tag.textContent.trim());
                        expect(tagLabels).to.include('BASE');

                        // Verify status checkbox reflects the initial store state
                        const statusPicker = filterPanel.shadowRoot.querySelector('[data-filter-type="status"]');
                        const draftCheckbox = statusPicker.querySelector('sp-checkbox[value="DRAFT"]');
                        expect(draftCheckbox.checked).to.be.true;
                    });

                    it('Personalization popover shows a switch instead of search; checkboxes are disabled when off', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const pznPicker = filterPanel.shadowRoot.querySelector('aem-tag-picker-field[top="pzn"]');
                        expect(pznPicker).to.not.be.null;
                        await delay(200);
                        await pznPicker.updateComplete;
                        expect(pznPicker.ready).to.be.true;

                        pznPicker.shadowRoot.querySelector('sp-action-button[slot="trigger"]').click();
                        await delay(100);
                        await pznPicker.updateComplete;

                        expect(pznPicker.shadowRoot.querySelector('sp-search')).to.be.null;
                        expect(pznPicker.shadowRoot.querySelector('#footer')).to.be.null;
                        const toggle = pznPicker.shadowRoot.querySelector('#aem-tag-picker-toggle');
                        expect(toggle).to.not.be.null;
                        expect(toggle.checked).to.be.false;

                        const list = pznPicker.shadowRoot.querySelector('.checkbox-list');
                        expect(list.classList.contains('checkbox-list--disabled')).to.be.true;

                        const generalPath = '/content/cq:tags/mas/pzn/general';
                        const cb = pznPicker.shadowRoot.querySelector(`sp-checkbox[value="${generalPath}"]`);
                        expect(cb).to.not.be.null;
                        expect(cb.disabled).to.be.true;
                    });

                    it('Should turn on personalization switch when filters include pzn tags from URL', async function () {
                        Store.filters.set({
                            tags: 'mas:pzn/general',
                        });

                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        expect(Store.filters.get().personalizationFilterEnabled).to.be.true;
                        expect(filterPanel.tagsByType.pzn).to.have.lengthOf(1);
                        expect(filterPanel.tagsByType.pzn[0].path).to.equal('/content/cq:tags/mas/pzn/general');
                    });

                    it('collapses nested product_code URL tag to parent path for filter chips', async function () {
                        Store.filters.set({
                            tags: 'mas:product_code/apptype/mypac',
                        });

                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        expect(filterPanel.tagsByType.product_code).to.have.lengthOf(1);
                        const chip = filterPanel.tagsByType.product_code[0];
                        expect(chip.path).to.equal('/content/cq:tags/mas/product_code/apptype');
                        expect(chip.title).to.equal('APPTYPE');
                        expect(chip.top).to.equal('product_code');
                    });

                    it('does not duplicate product_code when the same nested tag appears twice in URL', async function () {
                        Store.filters.set({
                            tags: 'mas:product_code/apptype/mypac,mas:product_code/apptype/mypac',
                        });

                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        expect(filterPanel.tagsByType.product_code).to.have.lengthOf(1);
                    });

                    it('expands parent-only product_code selection to leaf tags in store filters', async function () {
                        const filterPanel = initElementFromTemplate('filterPanel1', this.test.title);
                        await filterPanel.updateComplete;

                        const productCodePicker = filterPanel.shadowRoot.querySelector(
                            'aem-tag-picker-field[top="product_code"]',
                        );
                        expect(productCodePicker).to.not.be.null;
                        await productCodePicker.loadTags();
                        await productCodePicker.updateComplete;

                        await productCodePicker.toggleTag('/content/cq:tags/mas/product_code/apptype');
                        await filterPanel.updateComplete;

                        const tagsParam = Store.filters.get().tags || '';
                        expect(tagsParam).to.include('mas:product_code/apptype/mypac');
                    });
                });
            });
        </script>
        <main>
            <sp-theme system="spectrum-two" color="light" scale="medium"></sp-theme>
        </main>
        <template id="filterPanel1">
            <mas-filter-panel></mas-filter-panel>
        </template>
    </body>
</html>
