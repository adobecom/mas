<!doctype html>
<html>
    <head>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <title>quantity-select-field unit tests</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="../../../src/swc.js" type="module"></script>
    </head>
    <body>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import sinon from 'sinon';
            import {
                createQuantitySelectValue,
                joinLicenseLabel,
                parseQuantitySelectValue,
                splitLicenseLabel,
            } from '../../../src/common/fields/quantity-select.js';
            import '../../../src/fields/quantity-select-settings-field.js';
            import Events from '../../../src/events.js';

            runTests(() => {
                describe('quantity-select helpers', () => {
                    it('createQuantitySelectValue includes default-value', () => {
                        const markup = createQuantitySelectValue({
                            title: '',
                            min: '2',
                            step: '2',
                            defaultValue: '4',
                        });
                        expect(markup).to.include('default-value="4"');
                        expect(markup).to.include('min="2"');
                        expect(markup).to.include('step="2"');
                    });

                    it('parseQuantitySelectValue reads default-value', () => {
                        const parsed = parseQuantitySelectValue(
                            '<merch-quantity-select title="" min="2" max="10" step="2" default-value="6"></merch-quantity-select>',
                        );
                        expect(parsed.defaultValue).to.equal('6');
                        expect(parsed.min).to.equal('2');
                    });

                    it('parseQuantitySelectValue uses min when default-value is absent', () => {
                        const parsed = parseQuantitySelectValue(
                            '<merch-quantity-select min="3" max="10" step="1"></merch-quantity-select>',
                        );
                        expect(parsed.defaultValue).to.equal('3');
                    });

                    it('parseQuantitySelectValue empty value defaults defaultValue to 1', () => {
                        const parsed = parseQuantitySelectValue('');
                        expect(parsed.defaultValue).to.equal('1');
                    });
                });

                describe('quantity-select-field', () => {
                    it('re-aligns default to min when step change leaves default off the ladder', async () => {
                        const el = document.createElement('quantity-select-field');
                        el.value = createQuantitySelectValue({
                            title: '',
                            min: '2',
                            step: '1',
                            defaultValue: '3',
                        });
                        document.body.append(el);
                        await el.updateComplete;

                        const stepField = el.shadowRoot.querySelector('#quantity-selector-step');
                        stepField.value = '2';
                        stepField.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await el.updateComplete;

                        expect(el.defaultValue).to.equal('2');
                        expect(el.value).to.include('default-value="2"');
                        el.remove();
                    });

                    it('shows toast and keeps min when start is set above default quantity', async () => {
                        const stub = sinon.stub(Events.toast, 'emit');
                        const el = document.createElement('quantity-select-field');
                        el.value = createQuantitySelectValue({
                            title: '',
                            min: '1',
                            step: '1',
                            defaultValue: '3',
                        });
                        document.body.append(el);
                        await el.updateComplete;

                        const start = el.shadowRoot.querySelector('#quantity-selector-start');
                        start.value = '4';
                        start.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await el.updateComplete;

                        expect(stub.calledOnce).to.be.true;
                        expect(stub.firstCall.args[0].variant).to.equal('negative');
                        expect(el.min).to.equal('1');
                        stub.restore();
                        el.remove();
                    });

                    const render = async (config, attributes = {}) => {
                        const el = document.createElement('quantity-select-field');
                        for (const [name, value] of Object.entries(attributes)) el.setAttribute(name, value);
                        el.value = createQuantitySelectValue({ title: 'Seat', ...config });
                        document.body.append(el);
                        await el.updateComplete;
                        return el;
                    };
                    const optionValues = (el, selector) =>
                        [...el.shadowRoot.querySelectorAll(`${selector} sp-menu-item`)].map((item) =>
                            item.getAttribute('value'),
                        );
                    const config = { min: '1', step: '1', defaultValue: '1' };

                    it('renders pickers for minimum, default and increment', async () => {
                        const el = await render(config);
                        for (const id of ['start', 'default', 'step']) {
                            const picker = el.shadowRoot.querySelector(`#quantity-selector-${id}`);
                            expect(picker.localName).to.equal('sp-picker');
                            expect(picker.getAttribute('size')).to.equal('m');
                        }
                        expect(el.shadowRoot.querySelector('#quantity-selector-title').localName).to.equal('sp-textfield');
                        el.remove();
                    });

                    it('offers 1 to 10 for minimum and increment', async () => {
                        const el = await render(config);
                        const expected = Array.from({ length: 10 }, (_, i) => `${i + 1}`);
                        expect(optionValues(el, '#quantity-selector-start')).to.deep.equal(expected);
                        expect(optionValues(el, '#quantity-selector-step')).to.deep.equal(expected);
                        el.remove();
                    });

                    it('offers only the step ladder for default', async () => {
                        const el = await render({ min: '2', step: '3', defaultValue: '2' });
                        expect(optionValues(el, '#quantity-selector-default')).to.deep.equal(['2', '5', '8']);
                        el.remove();
                    });

                    it('keeps a legacy minimum outside 1 to 10 as an extra option', async () => {
                        const el = await render({ min: '12', step: '1', defaultValue: '12' });
                        expect(optionValues(el, '#quantity-selector-start')).to.include('12');
                        expect(el.shadowRoot.querySelector('#quantity-selector-start').value).to.equal('12');
                        expect(el.value).to.include('min="12"');
                        el.remove();
                    });

                    it('does not offer default values below the minimum', async () => {
                        const el = await render({ min: '5', step: '1', defaultValue: '5' });
                        expect(optionValues(el, '#quantity-selector-default')).to.not.include('3');
                        el.remove();
                    });

                    it('resets default to min when a step change leaves it off the ladder', async () => {
                        const el = await render({ min: '1', step: '2', defaultValue: '5' });
                        const step = el.shadowRoot.querySelector('#quantity-selector-step');
                        step.value = '3';
                        step.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await el.updateComplete;
                        expect(el.defaultValue).to.equal('1');
                        expect(el.value).to.include('default-value="1"');
                        el.remove();
                    });

                    it('emits a single change event with the same markup', async () => {
                        const el = await render({ min: '1', step: '1', defaultValue: '1' });
                        const handler = sinon.spy();
                        el.addEventListener('change', handler);
                        const def = el.shadowRoot.querySelector('#quantity-selector-default');
                        def.value = '4';
                        def.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        await el.updateComplete;
                        expect(handler.calledOnce).to.be.true;
                        expect(handler.firstCall.args[0].detail.value).to.equal(
                            '<merch-quantity-select title="Seat" min="1" default-value="4" max="10" step="1"></merch-quantity-select>',
                        );
                        el.remove();
                    });

                    it('disables all controls', async () => {
                        const el = await render(config);
                        el.disabled = true;
                        await el.updateComplete;
                        for (const id of ['title', 'start', 'default', 'step']) {
                            expect(el.shadowRoot.querySelector(`#quantity-selector-${id}`).hasAttribute('disabled')).to.be.true;
                        }
                        el.remove();
                    });

                    it('lays out the title full width and the pickers in three equal columns with layout grid', async () => {
                        const el = await render(config, { layout: 'grid' });
                        const rect = (id) => el.shadowRoot.querySelector(`#quantity-selector-${id}`).getBoundingClientRect();
                        const [start, def, step] = ['start', 'default', 'step'].map(rect);
                        expect(def.top).to.equal(start.top);
                        expect(step.top).to.equal(start.top);
                        expect(def.width).to.be.closeTo(start.width, 1);
                        expect(step.width).to.be.closeTo(start.width, 1);
                        expect(rect('title').width).to.be.closeTo(el.getBoundingClientRect().width, 1);
                        expect(rect('title').bottom).to.be.below(start.top);
                        el.remove();
                    });

                    it('stacks the controls full width with layout vertical or no layout', async () => {
                        for (const attributes of [{}, { layout: 'vertical' }]) {
                            const el = await render(config, attributes);
                            const rect = (id) =>
                                el.shadowRoot.querySelector(`#quantity-selector-${id}`).getBoundingClientRect();
                            const hostWidth = el.getBoundingClientRect().width;
                            expect(rect('default').top).to.be.above(rect('start').top);
                            expect(rect('step').top).to.be.above(rect('default').top);
                            expect(rect('start').width).to.be.closeTo(hostWidth, 1);
                            expect(rect('title').width).to.be.closeTo(hostWidth, 1);
                            el.remove();
                        }
                    });
                });

                describe('singular and plural labels', () => {
                    const renderSplit = async (title) => {
                        const el = document.createElement('quantity-select-field');
                        el.splitTitle = true;
                        el.value = createQuantitySelectValue({ title, min: '1', step: '1', defaultValue: '1' });
                        document.body.append(el);
                        await el.updateComplete;
                        return el;
                    };
                    const type = async (el, selector, value) => {
                        const input = el.shadowRoot.querySelector(selector);
                        input.value = value;
                        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
                        await el.updateComplete;
                    };

                    it('splits and joins "singular|plural"', () => {
                        expect(splitLicenseLabel('Seat|Seats')).to.deep.equal(['Seat', 'Seats']);
                        expect(splitLicenseLabel('Seat')).to.deep.equal(['Seat', '']);
                        expect(splitLicenseLabel('')).to.deep.equal(['', '']);
                        expect(joinLicenseLabel('Seat', 'Seats')).to.equal('Seat|Seats');
                        expect(joinLicenseLabel('', '')).to.equal('');
                    });

                    it('shows an existing "A|B" title in the two fields', async () => {
                        const el = await renderSplit('Seat|Seats');
                        expect(el.shadowRoot.querySelector('#quantity-selector-title')).to.not.exist;
                        expect(el.shadowRoot.querySelector('#quantity-selector-singular').value).to.equal('Seat');
                        expect(el.shadowRoot.querySelector('#quantity-selector-plural').value).to.equal('Seats');
                        el.remove();
                    });

                    it('stores both labels in the title as "singular|plural"', async () => {
                        const el = await renderSplit('');
                        await type(el, '#quantity-selector-singular', 'Seat');
                        await type(el, '#quantity-selector-plural', 'Seats');
                        expect(parseQuantitySelectValue(el.value).title).to.equal('Seat|Seats');
                        await type(el, '#quantity-selector-singular', '');
                        await type(el, '#quantity-selector-plural', '');
                        expect(parseQuantitySelectValue(el.value).title).to.equal('');
                        el.remove();
                    });

                    it('keeps the single title field when not split', async () => {
                        const el = document.createElement('quantity-select-field');
                        el.value = createQuantitySelectValue({ title: 'Seat', min: '1', step: '1', defaultValue: '1' });
                        document.body.append(el);
                        await el.updateComplete;
                        expect(el.shadowRoot.querySelector('#quantity-selector-title')).to.exist;
                        expect(el.shadowRoot.querySelector('#quantity-selector-singular')).to.not.exist;
                        el.remove();
                    });
                });

                describe('quantity-select-settings-field', () => {
                    it('turns the switch on with the license placeholders as title for Pro only', async () => {
                        const titleAfterToggle = async (splitTitle) => {
                            const el = document.createElement('quantity-select-settings-field');
                            el.id = 'quantity-select-settings-field';
                            el.splitTitle = splitTitle;
                            el.value = '<merch-quantity-select/>';
                            document.body.append(el);
                            await el.updateComplete;
                            const toggle = el.querySelector('#quantity-select-settings-field-toggle');
                            toggle.checked = true;
                            toggle.dispatchEvent(new Event('change', { bubbles: true }));
                            const { title } = parseQuantitySelectValue(el.value);
                            el.remove();
                            return title;
                        };
                        expect(await titleAfterToggle(true)).to.equal('{{license-label}}|{{licenses-label}}');
                        expect(await titleAfterToggle(false)).to.equal('');
                    });

                    it('renders the quantity field with layout grid', async () => {
                        const el = document.createElement('quantity-select-settings-field');
                        el.id = 'quantity-select-settings-field';
                        el.value = '<merch-quantity-select title="" min="1" max="10" step="1"></merch-quantity-select>';
                        document.body.append(el);
                        await el.updateComplete;
                        expect(el.querySelector('quantity-select-field').getAttribute('layout')).to.equal('grid');
                        el.remove();
                    });

                    it('renders the switch when settingsDefaults is empty', async () => {
                        const el = document.createElement('quantity-select-settings-field');
                        el.id = 'quantity-select-settings-field';
                        el.label = 'Show quantity selector';
                        el.settingsDefaults = '';
                        el.value = '<merch-quantity-select/>';
                        document.body.append(el);
                        await el.updateComplete;

                        const toggle = el.querySelector('#quantity-select-settings-field-toggle');
                        expect(toggle).to.exist;
                        el.remove();
                    });
                });
            });
        </script>
    </body>
</html>
