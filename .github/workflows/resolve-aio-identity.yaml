name: Resolve AIO Identity

# Single source of truth for mapping a PR author to the credentials their IO deploy uses.
#
# Every author deploys to their own workspace, keyed by GitHub login. The one exception is
# the bot allowlist below: a GitHub App login carries a "[bot]" suffix, and brackets are not
# legal in a GitHub secret name, so `secrets[format('AIO_WWW_ENV_{0}', login)]` can never
# resolve for it. Allowlisted bots share the QA workspace instead.
#
# QA is safe to share: AIO_WWW_ENV_QA / AIO_WWW_AIO_QA / AIO_NS_QA are deployed to by no
# other workflow, unlike STAGE, which io-merge.yaml owns for main.
#
# Allowlisted bots' io/studio deploys read the stage Odin bucket, matching Piñata's
# stage-pinned Studio previews, and skip the shared AOS/OST service secrets.

on:
    workflow_call:
        inputs:
            login:
                description: 'GitHub login of the PR author (github.event.pull_request.user.login)'
                type: string
                required: true
        outputs:
            secret_suffix:
                description: 'Suffix for the AIO_WWW_ENV_/AIO_WWW_AIO_/AIO_NS_ secret names'
                value: ${{ jobs.resolve.outputs.secret_suffix }}
            vault_login:
                description: >
                    Path segment for merch-at-scale/aio-studio/<login>, minus any trailing
                    [bot]. Never QA: that Vault path holds only odin_bucket, no env/aio.
                value: ${{ jobs.resolve.outputs.vault_login }}
            odin_bucket_path:
                description: 'Vault path holding the odin_bucket for io/studio deploys: stage for allowlisted bots, QA otherwise'
                value: ${{ jobs.resolve.outputs.odin_bucket_path }}
            shared_secrets:
                description: "'false' for allowlisted bots: their io/studio deploys skip the shared AOS/OST service secrets"
                value: ${{ jobs.resolve.outputs.shared_secrets }}

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            secret_suffix: ${{ steps.map.outputs.secret_suffix }}
            vault_login: ${{ steps.map.outputs.vault_login }}
            odin_bucket_path: ${{ steps.map.outputs.odin_bucket_path }}
            shared_secrets: ${{ steps.map.outputs.shared_secrets }}
        steps:
            - name: Map author to deploy identity
              id: map
              env:
                  LOGIN: ${{ inputs.login }}
              run: |
                  set -euo pipefail

                  case "$LOGIN" in
                      'pinatacode[bot]')
                          secret_suffix=QA
                          odin_bucket_path=merch-at-scale/aio-studio/stage
                          shared_secrets=false
                          ;;
                      *)
                          secret_suffix="$LOGIN"
                          odin_bucket_path=merch-at-scale/aio-studio/qa
                          shared_secrets=true
                          ;;
                  esac

                  vault_login=$(printf '%s' "$LOGIN" | sed 's/\[bot\]$//')

                  echo "Resolved '$LOGIN' to secret suffix '$secret_suffix', vault login '$vault_login', odin bucket '$odin_bucket_path', shared secrets '$shared_secrets'"
                  {
                      echo "secret_suffix=$secret_suffix"
                      echo "vault_login=$vault_login"
                      echo "odin_bucket_path=$odin_bucket_path"
                      echo "shared_secrets=$shared_secrets"
                  } >> "$GITHUB_OUTPUT"
