name: Shared Render Tests
on:
    pull_request:
        paths:
            - 'render/**'
            - 'package.json'
            - 'package-lock.json'
            - 'eslint.config.mjs'
            - '.github/workflows/render-tests.yaml'
    push:
        branches:
            - main
        paths:
            - 'render/**'
            - 'package.json'
            - 'package-lock.json'
            - 'eslint.config.mjs'
            - '.github/workflows/render-tests.yaml'
    workflow_dispatch:
jobs:
    render:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm run test:ci --workspace=@adobecom/mas-render
            - run: npx eslint render eslint.config.mjs
            - run: npx prettier --check render package.json .github/workflows/render-tests.yaml
