name: Extension Release

on:
    push:
        tags:
            - 'mas-extension-v*'

permissions:
    contents: write

jobs:
    release:
        name: Package and release extension
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                working-directory: extension

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Check tag matches manifest and package versions
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#mas-extension-v}"
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($MANIFEST_VERSION) and package.json ($PACKAGE_VERSION)"
                      exit 1
                  fi

            - name: Run unit tests
              run: npm test

            - name: Build extension zip
              run: |
                  npm run package
                  mv mas-studio-extension.zip "$GITHUB_REF_NAME.zip"
                  unzip -l "$GITHUB_REF_NAME.zip"

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >
                  gh release create "$GITHUB_REF_NAME" "$GITHUB_REF_NAME.zip"
                  --title "M@S extension ${GITHUB_REF_NAME#mas-extension-v}"
                  --notes "Upload this zip in the Chrome Web Store developer dashboard."
                  --latest=false
