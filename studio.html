        <script>
            // Relay check - redirect back to origin port if relayPort param + token in hash
            const relayPort = new URLSearchParams(window.location.search).get('relayPort');
            if (relayPort && window.location.hash.length > 1) {
                const url = new URL(window.location.href);
                url.hostname = 'localhost';
                url.port = relayPort;
                url.searchParams.delete('relayPort');
                window.location.replace(url.toString());
            }
        </script>
        <script>
            const BUCKETS = {
                qa: 'e155390',
                stage: 'e59471',
                prod: 'e59433',
            };
            const params = new URLSearchParams(window.location.search);
            const envOverride = params.get('aem.env');
            const isLocal = window.location.href.includes('localhost');
            let bucket;
            let baseUrl;
            if (isLocal) {
                const proxyPort = params.get('proxy.port') || 8080;
                baseUrl = `http://localhost:${proxyPort}`;
            } else {
                bucket = envOverride && BUCKETS[envOverride] ? BUCKETS[envOverride] : BUCKETS.prod;
                baseUrl = `https://author-p22655-${bucket}.adobeaemcloud.com`;
            }
            if (envOverride) {
                document.querySelector('title').innerText += ` [${envOverride.toUpperCase()}]`;
            }
            document.querySelector('meta[name="aem-base-url"]')?.setAttribute('content', baseUrl);
            const ioStudioEnvParam = params.get('io.studio.env') || envOverride;
            const ioStudioEnv = ioStudioEnvParam ? `-${ioStudioEnvParam}` : '';
            const ioBaseUrl = `https://14257-masstudio${ioStudioEnv}.adobeioruntime.net/api/v1/web/MerchAtScaleStudio`;
            document.querySelector('meta[name="io-base-url"]')?.setAttribute('content', ioBaseUrl);

        <!-- Boot: writes one import map and every Studio asset tag with a content version (?v=), so Akamai never mixes old and new files. studio/build-versions.mjs reads the quoted paths below. -->
        <script id="studio-boot">
            (function () {
                const params = new URLSearchParams(location.search);
                const cacheSalt = /^\d{1,9}$/.test(params.get('cb') ?? '') ? params.get('cb') : '';
                let versions = {};
                try {
                    versions = JSON.parse(document.getElementById('studio-versions').textContent);
                } catch (error) {
                    console.error('[M@S Studio] invalid studio-versions block, loading unversioned assets', error);
                }
                const unversioned = new Set();
                const versioned = (path) => {
                    const hash = versions[path];
                    if (!hash) {
                        unversioned.add(path);
                        return path;
                    }
                    return cacheSalt ? `${path}?v=${hash}-${cacheSalt}` : `${path}?v=${hash}`;
                };

                const bootAssetPath = /^\/(studio|web-components)\//;
                const isBootAsset = (url) => {
                    if (!url) return false;
                    const parsed = new URL(url, location.href);
                    return parsed.origin === location.origin && bootAssetPath.test(parsed.pathname);
                };
                const revealBootError = () => {
                    document.querySelector('.studio-boot')?.remove();
                    document.querySelector('.studio-boot-error')?.removeAttribute('hidden');
                };
                const onBootError = (event) => {
                    const { target } = event;
                    const element = target instanceof HTMLScriptElement || target instanceof HTMLLinkElement ? target : null;
                    const url = element ? element.src || element.href : event.filename;
                    if (!isBootAsset(url) && event.error?.name !== 'SyntaxError') return;
                    console.error('[M@S Studio] boot failed', url);
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', revealBootError, { once: true });
                    } else {
                        revealBootError();
                    }
                };
                const onReloadClick = (event) => {
                    if (!event.target.closest?.('.studio-boot-error button')) return;
                    const url = new URL(location.href);
                    url.searchParams.set('cb', String(Number(cacheSalt || 0) + 1));
                    location.assign(url.href);
                };
                window.addEventListener('error', onBootError, true);
                document.addEventListener('click', onReloadClick);
                customElements.whenDefined('mas-studio').then(() => {
                    window.removeEventListener('error', onBootError, true);
                    document.removeEventListener('click', onReloadClick);
                    document.querySelector('.studio-boot-error')?.setAttribute('hidden', '');
                });

                const lit = '/web-components/dist/lit-all.min.js';
                const prosemirror = '/studio/libs/prosemirror.js';
                const imports = {
                    lit: versioned(lit),
                    'lit/directives/unsafe-html.js': versioned(lit),
                    'lit/directives/style-map.js': versioned(lit),
                    'lit/directives/class-map.js': versioned(lit),
                    'lit/directives/repeat.js': versioned(lit),
                    'lit/directives/until.js': versioned(lit),
                    'lit/directives/keyed.js': versioned(lit),
                    'prosemirror-state': versioned(prosemirror),
                    'prosemirror-model': versioned(prosemirror),
                    'prosemirror-view': versioned(prosemirror),
                    'prosemirror-keymap': versioned(prosemirror),
                    'prosemirror-schema-basic': versioned(prosemirror),
                    'prosemirror-commands': versioned(prosemirror),
                    'prosemirror-schema-list': versioned(prosemirror),
                    'prosemirror-history': versioned(prosemirror),
                    'fragment-client': versioned('/studio/libs/fragment-client.js'),
                };
                Object.keys(versions)
                    .filter((path) => path.endsWith('.js'))
                    .forEach((path) => {
                        imports[path] = versioned(path);
                    });

                // OST: legacy tacocat bundle by default; ?ost=new (or #ost=new) loads the new Lit OST.
                const ost = params.get('ost') || (location.hash.match(/(?:^#|&)ost=([^&]+)/) || [])[1];
                const ostScript = ost === 'new' ? '/studio/ost/ost-new.js' : '/studio/ost/index.js';

                document.write(
                    [
                        `<script type="importmap">${JSON.stringify({ imports })}<\/script>`,
                        `<script src="${versioned('/web-components/dist/mas.js')}" type="module"><\/script>`,
                        `<script src="${versioned('/studio/libs/swc.js')}" type="module"><\/script>`,
                        `<script src="${versioned(ostScript)}" defer><\/script>`,
                        `<link rel="stylesheet" href="${versioned('/studio/ost/index.css')}" />`,
                        `<link rel="stylesheet" href="${versioned('/studio/libs/spectrum.css')}" />`,
                        `<link rel="stylesheet" href="${versioned('/studio/mas-fragment-render.css')}" />`,
                        `<link rel="stylesheet" href="${versioned('/studio/style.css')}" />`,
                        `<link rel="stylesheet" href="${versioned('/studio/merch-card.css')}" />`,
                        `<link rel="stylesheet" href="${versioned('/studio/con-button.css')}" />`,
                        `<script src="${versioned('/studio/src/studio.js')}" type="module"><\/script>`,
                    ].join(''),
                );
                if (unversioned.size) {
                    console.warn('[M@S Studio] assets without a version, run npm run build:versions -w studio:', [
                        ...unversioned,
                    ]);
                }
            })();
        </script>
        <link rel="stylesheet" href="https://use.typekit.net/hah7vzn.css" />
        <script>
            function initMasStudio() {
                console.info('[M@S Studio] IMS is ready, signed in');
                const studio = document.createElement('mas-studio');
                studio.setAttribute('base-url', baseUrl);
                bucket && studio.setAttribute('aem-bucket', bucket);
                document.querySelector('sp-theme').appendChild(studio);
                if (envOverride) studio.aemEnv = envOverride;
                customElements.whenDefined('mas-studio').then(() => document.querySelector('.studio-boot')?.remove());
            }
            const context = {
                profile_filter: `{"findFirst":true,"fallbackToAA":true,"searchEntireCluster":true};isOwnedByOrg('3B962FB55F5F922E0A495C88@AdobeOrg')`,
            };
            window.adobeid = {
                api_parameters: {
                    profile_filter: "isOwnedByOrg('3B962FB55F5F922E0A495C88@AdobeOrg')",
                },
                client_id: 'mas-studio',
                environment: 'prod',
                locale: 'en_US',
                redirect_uri:
                    location.port && location.port !== '3000'
                        ? `http://localhost:3000/studio.html?relayPort=${location.port}`
                        : location.href.substring(0, location.href.length - location.hash.length),
                response_type: 'id_token',
                scope: 'additional_info,additional_info.projectedProductContext,additional_info.roles,AdobeID,openid,read_organizations,read_members',
                useLocalStorage: true,
                authorize() {
                    const { expire, token } = window.adobeIMS?.getAccessToken() ?? {};
                    if (token && (expire?.valueOf() ?? 0) > Date.now()) return token;
                    window.adobeIMS?.signIn();
                },
                onError(error) {
                    console.error('[M@S Studio] IMS error: ', error);
                },
                onReady() {
                    adobeIMS
                        .validateToken()
                        .then(initMasStudio)
                        .catch((e) => {
                            console.error('[M@S Studio] failed to refresh IMS token: ', e);
                            console.info('[M@S Studio] Signing in');
                            adobeIMS.signIn(context);
                        });
                },
            };
        </script>
        <script src="https://www.adobe.com/libs/deps/imslib.min.js"></script>
    </head>
    <body class="spectrum spectrum--medium spectrum--light">
        <div class="studio-boot" role="status">
            <div class="studio-boot-spinner"></div>
            <span class="studio-boot-label">Loading Studio…</span>
        </div>
        <div class="studio-boot-error" role="alert" hidden>
            <p>Studio couldn't load. This can happen right after an update.</p>
            <button type="button">Reload</button>
        </div>
        <mas-commerce-service></mas-commerce-service>
        <main>
            <sp-theme system="spectrum-two" color="light" scale="medium"> </sp-theme>
        </main>
    </body>
</html>
