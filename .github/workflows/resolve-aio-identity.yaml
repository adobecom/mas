name: Resolve AIO Identity

# Single source of truth for mapping a PR author to the credentials their IO deploy uses.
#
# Human authors deploy to their own workspace, keyed by GitHub login. GitHub Apps cannot:
# their login carries a "[bot]" suffix, and brackets are not legal in a GitHub secret name,
# so `secrets[format('AIO_WWW_ENV_{0}', login)]` silently resolves to an empty string and
# the deploy fails. Allowlisted bots map to a shared workspace instead. Any author who is
# neither allowlisted nor registered still fails loudly downstream.

on:
    workflow_call:
        inputs:
            login:
                description: 'GitHub login of the PR author (github.event.pull_request.user.login)'
                type: string
                required: true
        outputs:
            secret_suffix:
                description: 'Suffix for the AIO_WWW_ENV_/AIO_WWW_AIO_/AIO_NS_ secret names'
                value: ${{ jobs.resolve.outputs.secret_suffix }}
            vault_login:
                description: 'Path segment for merch-at-scale/aio-studio/<login>, lowercased'
                value: ${{ jobs.resolve.outputs.vault_login }}

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            secret_suffix: ${{ steps.map.outputs.secret_suffix }}
            vault_login: ${{ steps.map.outputs.vault_login }}
        steps:
            - name: Map author to deploy identity
              id: map
              env:
                  LOGIN: ${{ inputs.login }}
              run: |
                  set -euo pipefail

                  # io/www: QA owns AIO_WWW_ENV_QA / AIO_WWW_AIO_QA / AIO_NS_QA, which no
                  # other workflow deploys to — unlike STAGE, which io-merge.yaml owns.
                  # io/studio: a dedicated Vault path, seeded like any developer workspace.
                  case "$LOGIN" in
                      'pinatacode[bot]')
                          secret_suffix=QA
                          vault_login=pinatacode
                          ;;
                      *)
                          secret_suffix="$LOGIN"
                          vault_login=$(printf '%s' "$LOGIN" | tr '[:upper:]' '[:lower:]')
                          ;;
                  esac

                  echo "Resolved '$LOGIN' to secret suffix '$secret_suffix', vault login '$vault_login'"
                  echo "secret_suffix=$secret_suffix" >> "$GITHUB_OUTPUT"
                  echo "vault_login=$vault_login" >> "$GITHUB_OUTPUT"
