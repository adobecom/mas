name: Run Nala Tests

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, labeled, unlabeled]
    # Re-evaluate when a review lands, so an already-labeled PR starts Nala
    # as soon as it reaches the required approval count.
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read
    checks: read

env:
    # Keep in sync with the branch-protection required-approval count. These are
    # separate sources of truth and will drift if one is changed without the other.
    REQUIRED_APPROVALS: 2

# Concurrency is declared per job rather than workflow-wide: the cheap jobs must
# run for every trigger so the gate always reports, and only the heavy E2E jobs
# are worth cancelling.

jobs:
    identity:
        uses: ./.github/workflows/resolve-aio-identity.yaml
        with:
            login: ${{ github.event.pull_request.user.login }}

    check-paths:
        name: Check Changed Paths
        runs-on: ubuntu-latest
        # No concurrency group: a cancelled result would stick to a gate re-run.
        outputs:
            is-trivial: ${{ steps.filter.outputs.trivial }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # pull_request_review defaults to the base branch, and the event
                  # payload SHA is a stale snapshot on a replayed re-run. The pull ref
                  # always resolves to the live head, matching the E2E jobs.
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
                  fetch-depth: 0
            - name: Detect trivial-only changes
              id: filter
              uses: ./.github/actions/detect-trivial
              with:
                  base-ref: ${{ github.event.pull_request.base.ref }}

    check-approvals:
        name: Check Label and Approvals
        runs-on: ubuntu-latest
        # Pure recompute, safe to supersede — a newer trigger restarts the poll below.
        concurrency:
            group: nala-check-approvals-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        # Generous because this job waits out an in-progress Nala run on the same
        # commit rather than reporting it as unresolved. Must exceed the poll
        # deadline in .github/actions/resolve-nala-status.
        timeout-minutes: 55
        outputs:
            can-run: ${{ steps.check.outputs.can-run }}
            # A prior conclusion of any kind means Nala must not be started again
            # for this commit; the gate resolves the verdict itself.
            already-handled: ${{ steps.check.outputs.nala-conclusion != '' && steps.check.outputs.nala-conclusion != 'none' }}
            head-sha: ${{ steps.check.outputs.head-sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # pull_request_review defaults to the base branch, and the event
                  # payload SHA is a stale snapshot on a replayed re-run.
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
            - name: Count current approvals
              id: check
              uses: ./.github/actions/resolve-nala-status
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  required-approvals: ${{ env.REQUIRED_APPROVALS }}
                  # A new commit, or deliberately re-adding the 'run nala' label, is a
                  # genuine request to (re)run Nala. Anything else that re-evaluates the
                  # gate — a review landing/being dismissed, or an unrelated label change
                  # — must not restart Nala if it already ran (or is still running) for
                  # this exact commit. Without this, every extra approval beyond the
                  # required count fires a brand-new full suite.
                  consult-prior-runs: ${{ !(github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala'))) }}
                  # Wait the other run out instead of reporting 'running': its gate
                  # can settle before this one, which would leave this run's stale
                  # failure as the newest check and pin the PR red.
                  wait-for-in-flight: 'true'
                  github-token: ${{ github.token }}

    run-nala-studio-tests:
        # Keep in sync with nalaTestNames in .github/actions/resolve-nala-status.
        name: Running Nala Studio E2E UI Tests
        needs: [check-paths, check-approvals]
        if: |
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true' &&
            needs.check-approvals.outputs.already-handled != 'true'
        # Only a new commit, or a deliberate re-request via the label, should cancel
        # an in-progress test run; any other event that reaches this job at all does
        # so because the dedup guard in check-approvals found no prior run for this
        # exact commit.
        concurrency:
            group: nala-studio-tests-${{ github.event.pull_request.number }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala')) }}
        runs-on: [self-hosted, Linux, X64, nala-studio]
        timeout-minutes: 45 # Prevent hanging jobs
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Single source of truth for the head SHA: the dedup check in
                  # check-approvals resolves it live, and the event payload can be a
                  # stale snapshot on a replayed re-run.
                  ref: ${{ needs.check-approvals.outputs.head-sha }}
                  fetch-depth: 2

            - name: Set up Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            - name: Install Playwright system dependencies
              uses: ./.github/actions/prep-apt

            - name: Install/verify Playwright browsers
              run: |
                  # Always run this - it's idempotent and fast when browsers are already correct
                  # It checks version compatibility and only installs if browsers are missing or outdated
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Run Nala Studio Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-studio ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}
                  FORCE_COLOR: 3 # Force color output
                  # studio:3 + docs:1 = 4 workers × 45 RPS = 180 RPS, safely under 200 RPS EDS limit.
                  # Both jobs share the same self-hosted runner pool — 4 total workers = 4 vCPUs.
                  NALA_PLAYWRIGHT_WORKERS: 3

            # Traces are excluded on purpose: they capture the test account's IMS bearer tokens and this repo is public.
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: nala-studio-failures-attempt-${{ github.run_attempt }}
                  path: |
                      test-results/**/*.png
                      test-results/**/error-context.md
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Cleanup cloned cards
              if: always()
              run: node -e "
                  import('./nala/utils/global.teardown.js')
                  .then(module => module.default())
                  .catch(err => {
                  console.error('Cleanup failed:', err.message);
                  process.exit(1);
                  });"
              env:
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
                  IMS_PASS: ${{ secrets.IMS_PASS }}

    run-nala-docs-tests:
        # Keep in sync with nalaTestNames in .github/actions/resolve-nala-status.
        name: Running Nala Docs E2E UI Tests
        needs: [check-paths, check-approvals, identity]
        if: |
            needs.check-paths.outputs.is-trivial != 'true' &&
            needs.check-approvals.outputs.can-run == 'true' &&
            needs.check-approvals.outputs.already-handled != 'true'
        # See run-nala-studio-tests above for why this is job-scoped.
        concurrency:
            group: nala-docs-tests-${{ github.event.pull_request.number }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'run nala')) }}
        runs-on: [self-hosted, Linux, X64, nala-studio]
        timeout-minutes: 20 # Prevent hanging jobs
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # See run-nala-studio-tests for why this is not the event payload.
                  ref: ${{ needs.check-approvals.outputs.head-sha }}
                  fetch-depth: 0

            - name: Fetch base branch for diff
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch origin "${BASE_REF}"

            - name: Detect io/www changes
              id: filter
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  if git diff --quiet "origin/${BASE_REF}...HEAD" -- io/www/ 2>/dev/null; then
                      echo "io-www=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "io-www=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'npm'
                  cache-dependency-path: |
                      **/package-lock.json
                      **/yarn.lock

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/playwright.config.js') }}

            # Docs tests run on GitHub-hosted runners (ubuntu-latest) — no unattended-upgrades
            # lock contention, so the prep-apt composite action is not needed here.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install-deps

            - name: Install/verify Playwright browsers
              run: |
                  # Always run this - it's idempotent and fast when browsers are already correct
                  # It checks version compatibility and only installs if browsers are missing or outdated
                  npx playwright install

            - name: Set execute permission for gh.run.sh
              run: chmod +x ./nala/utils/gh.run.sh

            - name: Set MAS_IO_URL when io/www has changes
              if: steps.filter.outputs.io-www == 'true'
              env:
                  ACTOR_NS: ${{ secrets[format('AIO_NS_{0}', needs.identity.outputs.secret_suffix)] }}
                  ACTOR_LOGIN: ${{ github.event.pull_request.user.login }}
                  ACTOR_SUFFIX: ${{ needs.identity.outputs.secret_suffix }}
              run: |
                  if [ -z "$ACTOR_NS" ]; then
                    echo "::error::Missing AIO namespace secret AIO_NS_${ACTOR_SUFFIX} for PR author ${ACTOR_LOGIN}"
                    exit 1
                  fi
                  echo "Using AIO namespace for PR author ${ACTOR_LOGIN}"
                  echo "MAS_IO_URL=?mas-io-url=https://${ACTOR_NS}.adobeioruntime.net/api/v1/web/MerchAtScale" >> "$GITHUB_ENV"

            - name: Run Nala Docs Tests via gh.run.sh
              run: ./nala/utils/gh.run.sh
              env:
                  labels: "@mas-docs ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
                  branch: ${{ github.event.pull_request.head.ref }}
                  repoName: ${{ github.repository }}
                  prUrl: ${{ github.event.pull_request.head.repo.html_url }}
                  prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
                  prRepo: ${{ github.event.pull_request.head.repo.name }}
                  prBranch: ${{ github.event.pull_request.head.ref }}
                  prBaseBranch: ${{ github.event.pull_request.base.ref }}
                  GITHUB_ACTION_PATH: ${{ github.workspace }}
                  FORCE_COLOR: 3 # Force color output
                  NALA_PLAYWRIGHT_WORKERS: 1

    nala-gate:
        # The only required check in the main ruleset. It never skips, so GitHub's
        # "skipped required check counts as passed" rule can never mask a Nala run
        # that did not happen — unlike the E2E jobs, which skip while approvals are
        # still pending.
        name: Nala Gate
        needs: [check-paths, check-approvals, run-nala-studio-tests, run-nala-docs-tests]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: refs/pull/${{ github.event.pull_request.number }}/head
            # Re-derived here rather than read off check-approvals: re-running only
            # the failed gate reuses that job's outputs, so a gate that went red
            # while approvals were still pending could never turn green without
            # replaying the whole workflow and the whole Nala suite with it.
            - name: Resolve live PR and Nala state
              id: status
              uses: ./.github/actions/resolve-nala-status
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  required-approvals: ${{ env.REQUIRED_APPROVALS }}
                  consult-prior-runs: 'true'
                  wait-for-in-flight: 'false'
                  github-token: ${{ github.token }}
            - name: Resolve Nala status
              env:
                  PATHS_RESULT: ${{ needs.check-paths.result }}
                  IS_TRIVIAL: ${{ needs.check-paths.outputs.is-trivial }}
                  HAS_LABEL: ${{ steps.status.outputs.has-label }}
                  CAN_RUN: ${{ steps.status.outputs.can-run }}
                  NALA_CONCLUSION: ${{ steps.status.outputs.nala-conclusion }}
                  STUDIO_RESULT: ${{ needs.run-nala-studio-tests.result }}
                  DOCS_RESULT: ${{ needs.run-nala-docs-tests.result }}
              run: |
                  if [ "$PATHS_RESULT" != "success" ]; then
                      echo "::error::check-paths did not succeed (${PATHS_RESULT})"
                      exit 1
                  fi
                  # The only bypass is the git-computed is-trivial output, never a mutable label.
                  if [ "$IS_TRIVIAL" = "true" ]; then
                      echo "Trivial PR — Nala not required"
                      exit 0
                  fi
                  if [ "$HAS_LABEL" != "true" ]; then
                      echo "::error::Add the 'run nala' label to merge this PR"
                      exit 1
                  fi
                  if [ "$CAN_RUN" != "true" ]; then
                      echo "::error::${REQUIRED_APPROVALS} approvals from write-access reviewers are required before the E2E jobs start"
                      exit 1
                  fi
                  # This run's own E2E jobs take precedence: their check runs can still
                  # read as in-progress for a moment after the job hands off to us.
                  # A re-run gate may retain successes that a newer failing run on this SHA supersedes.
                  if [ "$STUDIO_RESULT" = "success" ] && [ "$DOCS_RESULT" = "success" ] \
                      && [ "$NALA_CONCLUSION" != "failure" ]; then
                      echo "Nala E2E passed"
                      exit 0
                  fi
                  # A re-run gate keeps its original needs results, so a newer passing run on this SHA overrides them.
                  if { [ "$STUDIO_RESULT" = "failure" ] || [ "$DOCS_RESULT" = "failure" ]; } && [ "$NALA_CONCLUSION" != "success" ]; then
                      echo "::error::Nala E2E did not pass (studio: ${STUDIO_RESULT}, docs: ${DOCS_RESULT})"
                      exit 1
                  fi
                  case "$NALA_CONCLUSION" in
                      success)
                          echo "Nala passed for this commit"
                          ;;
                      running)
                          echo "::error::Nala is still running for this commit — re-run this job once it finishes"
                          exit 1
                          ;;
                      none)
                          echo "::error::Nala has not run for this commit"
                          exit 1
                          ;;
                      *)
                          echo "::error::Nala did not pass for this commit (${NALA_CONCLUSION})"
                          exit 1
                          ;;
                  esac
