name: Run Nala Tests

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, labeled, unlabeled]

# PER-PR cancel-on-repush: scoped to github.ref, so a re-push to THIS PR cancels only this PR's
# own previous run (and, since cancelling a run cancels everything running under it, that
# cascades down and cancels the called nala-execution.yml reusable workflow's jobs too). Different
# PRs are in different groups here, so they never cancel each other — instead, nala-execution.yml
# (called below) applies its OWN repo-wide concurrency group with cancel-in-progress: false, which
# queues (rather than cancels) a different PR's run behind whichever run currently holds that
# lock. See nala-execution.yml's header comment for the full rationale — GitHub only allows one
# group + one cancel policy per workflow level, so this dispatcher/reusable-workflow split is what
# lets us have both behaviors at once.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    nala-execution:
        name: Nala Execution
        uses: ./.github/workflows/nala-execution.yml
        secrets: inherit
